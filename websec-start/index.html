vulns:{
a01:{ t:'A01 · Kirishni nazorat qilishning buzilishi', short:'Broken Access Control', tag:'Kirish',
 theory:[
 'Kirishni nazorat qilish — muayyan foydalanuvchiga nima qilish mumkinligini belgilaydigan tekshiruvlar: qaysi sahifalarni ko\'rish, kimning ma\'lumotlarini o\'qish, qaysi amallarni bajarish mumkin. Bu toifa server foydalanuvchining huquqini yetarlicha tekshirmasdan amal bajarganda yoki ma\'lumot bergnda yuzaga keladi.',
 'Eng keng tarqalgan misol — IDOR (Insecure Direct Object Reference): so\'rovda ob\'ekt identifikatori bor (masalan, /api/orders/1001), va server uni egasini tekshirmasdan shunchaki ID bo\'yicha beradi. Manzildagi raqamni almashtirish kifoya — va siz boshqa birovning buyurtmasini ko\'rasiz.',
 'Bunga yashirin admin URL manzillariga to\'g\'ridan-to\'g\'ri murojaat, role=user parametrini role=admin ga almashtirish orqali huquqlarni oshirish, va SSRF (Server-Side Request Forgery) — server foydalanuvchi bergan URL manziliga o\'zi so\'rov yuborganda, bu orqali ichki tarmoqqa yetib borish mumkin.',
 '2025-yilda bu №1 toifa — deyarli har bir sinovdan o\'tkazilgan ilovada uchraydi, chunki o\'nlab so\'rov ishlovchilaridan birida huquq tekshiruvini unutish oson.'
 ],
 find:['URL va so\'rov tanasidagi raqamli ID larni o\'zgartiring — boshqa birovning ma\'lumotlari ko\'rsatiladimi?','role, isAdmin, userId kabi mijozdan keladigan parametrlarni tekshiring — server ularga ishonadimi?','Admin endpointlarni (/admin, /api/admin/...) oddiy foydalanuvchi sifatida ochib ko\'ring.','Server foydalanuvchi bergan URL manzilga o\'zi murojaat qiladimi (SSRF) — masalan, "webhook URL" yoki "havola orqali rasm yuklash" maydoni.'],
 fix:['Har bir so\'rovda ob\'ekt egaligini serverda tekshiring, interfeysda emas.','"Standart bo\'yicha taqiqlangan" siyosatidan foydalaning — kirish faqat aniq ruxsat berilganda.','Mijozdan kelgan rol/huquqlarga hech qachon ishonmang — ularni serverdagi sessiyadan oling.','"Server foydalanuvchi havolasiga murojaat qiladi" so\'rovlari uchun ruxsat etilgan xostlar ro\'yxatidan foydalaning.'],
 quiz:[
  {q:'Foydalanuvchi manzil satrida /api/invoice/2048 ni /api/invoice/2049 ga o\'zgartirib, boshqa birovning hisob-fakturasini ko\'radi. Bu qanday zaiflik deb ataladi?', opts:['SQL in\'ektsiyasi','IDOR (ob\'ektga xavfsiz bo\'lmagan to\'g\'ridan-to\'g\'ri havola)','XSS','CSRF'], correct:1, exp:'Server ob\'ektni egasini tekshirmasdan ID bo\'yicha berdi — bu klassik IDOR, kirishni nazorat qilish buzilishining maxsus holati.'},
  {q:'IDOR dan eng kuchli himoya qaysi tekshiruv hisoblanadi?', opts:['ID ni tasodifiy satr bilan yashirish','Serverda ob\'ekt joriy foydalanuvchiga tegishli ekanligini tekshirish','Formaga captcha qo\'shish','HTTPS dan foydalanish'], correct:1, exp:'"Yashirin" ID ni topish yoki tanlab olish mumkin — yagona ishonchli himoya serverda egalikni aniq tekshirishdir.'},
  {q:'SSRF nima?', opts:['Foydalanuvchi nomidan so\'rovni soxtalashtirish (CSRF)','Server foydalanuvchidan olingan URL manzilga o\'zi so\'rov yuboradi','Qurbon brauzerida bajariladigan zararli skript','Parollarni heshlashning zaif algoritmi'], correct:1, exp:'SSRF da hujumchi serverning o\'ziga kerakli manzilga, masalan ichki tarmoqqa, murojaat qilishga majbur qiladi.'},
  {q:'Nega "role=admin" tekshiruvi mijoz so\'rovidagi parametrga ishonilmasligi kerak?', opts:['Chunki bu sekin','Chunki mijoz istalgan qiymatni yuborishi mumkin — server rolni o\'z sessiyasidan olishi kerak','Chunki JSON mantiqiy qiymatlarni qo\'llab-quvvatlamaydi','HTTPS ishlatilsa bu muammo emas'], correct:1, exp:'Mijoz ma\'lumotlari to\'liq hujumchi nazoratida bo\'ladi; huquqlar haqidagi haqiqat manbai server bo\'lishi kerak.'}
 ] },
a02:{ t:'A02 · Xavfsiz bo\'lmagan konfiguratsiya', short:'Security Misconfiguration', tag:'Sozlama',
 theory:[
 'Bu toifa "standart" sozlamalar, keraksiz imkoniyatlar va konfiguratsiya xatolari haqida: yoqilgan katalog ro\'yxati, ishlab chiqarishdagi test sahifalari, stack-trace bilan batafsil xato xabarlari, ochiq .git yoki .env, keraksiz HTTP metodlari, yo\'q xavfsizlik sarlavhalari.',
 'Muammo kodda bitta "teshik" emas, balki server o\'zi haqida juda ko\'p ma\'lumot berishi (versiya banerlari, xizmat fayllari) yoki kerakligidan ko\'proq imkoniyat berishi. Shu sababli 2025-yilda bu toifa 2-o\'ringa ko\'tarildi — u deyarli har bir joylashtirishga ta\'sir qiladi.',
 'Odatiy holat: dasturchi nginx-da autoindex on ni qoldirgan — va ma\'lumotlar bazasi zaxira nusxalari bo\'lgan butun katalog to\'g\'ridan-to\'g\'ri havola orqali ochiq bo\'lib qoladi. Yoki ma\'lumotlar bazasi parollari bo\'lgan .env sayt ildizida topilib, oddiy matn fayli sifatida beriladi.'
 ],
 find:['/.git/HEAD, /.env, /backup.zip, /config.php.bak manzillarini tekshiring — xizmat fayllari beriladimi?','Javob sarlavhalariga (curl -I) qarang — server/freymvork versiyasi ko\'rinadimi?','Index fayli bo\'lmagan katalogni ochib ko\'ring — ro\'yxat yoqilganmi?','Mavjud bo\'lmagan manzilga murojaat qiling — server yo\'llari bilan stack-trace "oqib chiqmayaptimi"?'],
 fix:['Katalog ro\'yxatini va versiyalarni ko\'rsatishni o\'chiring (server_tokens off).','Xizmat fayllarini va .git ni ommaviy katalogdan olib tashlang, ularga kirishni aniq taqiqlang.','Foydalanuvchiga umumiy xato sahifasini ko\'rsating, tafsilotlarni faqat loglarda saqlang.','Xavfsizlik sarlavhalarini qo\'shing: HSTS, X-Content-Type-Options, CSP.'],
 quiz:[
  {q:'Quyidagilardan qaysi biri xavfsiz bo\'lmagan konfiguratsiyaga misol?', opts:['Satrlarni birlashtirish orqali tuzilgan SQL so\'rovi','Ishlab chiqarish serverida ochiq /.git/ katalogi','Parollarni heshlashning zaif MD5 algoritmi','Ob\'ekt egasini tekshirmaslik'], correct:1, exp:'Ochiq .git katalogi — bu server konfiguratsiyasi sabab bo\'lgan oqish, biznes-mantiqdagi xato emas.'},
  {q:'Nega foydalanuvchiga batafsil stack-trace ko\'rsatmaslik kerak?', opts:['Bu saytni tezlashtiradi','U server yo\'llarini, kutubxona versiyalarini va kod tuzilmasini oshkor qilishi mumkin — hujum uchun maslahat','HTTP protokoli shuni talab qiladi','Bu xavfsizlikka ta\'sir qilmaydi'], correct:1, exp:'Batafsil xato — hujumchi uchun bepul razvedka.'},
  {q:'Strict-Transport-Security (HSTS) sarlavhasi nima qiladi?', opts:['Ma\'lumotlar bazasidagi parollarni shifrlaydi','Brauzerni saytga faqat HTTPS orqali murojaat qilishga majbur qiladi','SQL in\'ektsiyalarini bloklaydi','So\'rovlar chastotasini cheklaydi'], correct:1, exp:'HSTS ulanishning shifrlanmagan HTTP ga tushirilishidan himoya qiladi.'},
  {q:'Nega katalog ro\'yxati (autoindex on) xavfli?', opts:['U katalog fayllari ro\'yxatini barcha tashrif buyuruvchilarga, shu jumladan tasodifan qoldirilgan zaxira va konfiguratsiyalarni ko\'rsatadi','U serverni sekinlashtiradi','U HTML sahifa hajmini oshiradi','U qidiruv tizimlari tomonidan indekslashga xalaqit beradi'], correct:0, exp:'Ro\'yxat index faylisiz istalgan katalogni ommaviy fayl brauzeriga aylantiradi.'}
 ] },
a03:{ t:'A03 · Dasturiy ta\'minot yetkazib berish zanjiridagi nosozliklar', short:'Software Supply Chain Failures', tag:'Bog\'liqliklar',
 theory:[
 'Zamonaviy ilova deyarli to\'liq boshqa birovning kodidan iborat: kutubxonalar, paketlar, Docker tasvirlari, CI/CD skriptlari. "Yetkazib berish zanjiridagi nosozlik" — hujumchi to\'g\'ridan-to\'g\'ri sizning kodingizni emas, balki u bog\'liq bo\'lgan narsani buzganda.',
 'Hujum shakllari xilma-xil: hech kim yangilamagan ma\'lum CVE bilan zaif kutubxona versiyasi; dependency confusion (ichki nom bilan bir xil, lekin yuqoriroq versiyali ommaviy paket — paket menejeri zararli ommaviy paketni tortadi); har bir yig\'ishda sezdirmasdan backdoor joylashtiruvchi buzilgan CI/CD quvuri.',
 '2025-yilda bu yangi alohida toifa — avval faqat "eskirgan komponentlar" haqida gapirilardi, endi butun hayot sikli ko\'rib chiqiladi: paket qayerdan kelgan, kim imzolagan, yig\'ish takrorlanuvchan.'
 ],
 find:['package.json/requirements.txt ni tekshiring — belgilangan versiyalar o\'rniga "*" yoki "latest" bormi?','Bog\'liqliklar zaifligi skanerini (masalan, trivy) ishga tushiring — ma\'lum CVE lar bormi?','CI konfiguratsiyasiga qarang — skriptlar kontrol summasi/imzosini tekshirmasdan yuklab olinib ishga tushiriladimi?','Lock-fayl (package-lock.json) repozitoriyda saqlanganmi?'],
 fix:['Bog\'liqliklarning aniq versiyalarini belgilang va lock-faylni commit qiling.','Bog\'liqliklarni muntazam skanerlang va ma\'lum zaifliklari bo\'lgan komponentlarni yangilang.','O\'rnatish skriptlarini imzo/heshni tekshirmasdan yuklab olmang va ishga tushirmang.','Dependency confusion ni istisno qilish uchun ommaviydan ustun bo\'lgan xususiy paket reestridan foydalaning.'],
 quiz:[
  {q:'Dependency confusion nima?', opts:['O\'zgaruvchi nomidagi xato','Ichkidan yuqoriroq versiyali nom bilan ommaviy paket — paket menejeri xususiy o\'rniga uni o\'rnatadi','npm hisobi parolini unutish','Loyihada ikki xil dasturlash tilidan foydalanish'], correct:1, exp:'Hujum versiya ustuvorligiga asoslangan: agar ommaviy versiya "yangiroq" bo\'lsa, ko\'p paket menejerlari aynan uni tanlaydi.'},
  {q:'Nega package.json da "express": "*" yomon amaliyot?', opts:['Shunda loyiha ko\'proq joy egallaydi','Har qanday, shu jumladan zararli yoki zaif yangi versiya avtomatik o\'rnatiladi','Bu JSON ning eskirgan sintaksisi','Bu faqat o\'rnatish tezligiga ta\'sir qiladi'], correct:1, exp:'Belgilanmagan versiya yig\'ishga qanday kod tushishi ustidan nazoratni olib tashlaydi.'},
  {q:'Nega lock-faylni (package-lock.json) repozitoriyga commit qilish kerak?', opts:['Repozitoriy hajmini kamaytirish uchun','Hamma va CI da bir xil, tekshirilgan bog\'liqlik versiyalari o\'rnatilishi uchun','Bu MIT litsenziyasi talabi','IDE ishlashini tezlashtirish uchun'], correct:1, exp:'Lock-fayl bog\'liqliklar daraxtini belgilaydi — yig\'ish takrorlanuvchan va bashorat qilinadigan bo\'ladi.'},
  {q:'Quyidagilardan qaysi biri CI/CD quvurini himoya qilish amaliyoti?', opts:['Tekshirmasdan curl https://get.example.sh | bash','O\'rnatuvchini yuklab olib, ishga tushirishdan oldin kontrol summasini solishtirish','Barcha sirlarni to\'g\'ridan-to\'g\'ri quvur kodida saqlash','Yig\'ish loglarini o\'chirish'], correct:1, exp:'Hesh/imzoni tekshirish almashtirilgan yoki buzilgan skriptning sezilmasdan ishga tushishiga yo\'l qo\'ymaydi.'}
 ] },
a04:{ t:'A04 · Kriptografik nosozliklar', short:'Cryptographic Failures', tag:'Kripto',
 theory:[
 'Bu ma\'lumotlar saqlash va uzatishda qanday himoyalangani (yoki himoyalanmagani) haqida: parollar, karta raqamlari, sessiya tokenlari, shaxsiy ma\'lumotlar. Ilgari toifa "nozik ma\'lumotlarning oshkor bo\'lishi" deb atalardi — endi e\'tibor asosiy sababga qaratildi: zaif yoki mavjud bo\'lmagan kriptografiya.',
 'Keng tarqalgan xatolar: parollar ochiq holda saqlanadi yoki tuzsiz tez algoritm bilan heshlanadi (MD5, SHA1) — bunday heshlar video kartada soniyalar ichida buziladi; sayt HTTPS o\'rniga HTTP orqali ishlashga ruxsat beradi; o\'z-o\'zidan yozilgan yoki eskirgan shifrlash algoritmlari ishlatiladi; maxfiy kalitlar kodga "yozib qo\'yilgan".',
 'Parollar uchun to\'g\'ri yondashuv — maxsus shu maqsadda yaratilgan sekin algoritmlar (Argon2, bcrypt, scrypt), tuz bilan, ular har bir urinish uchun ataylab ko\'p vaqt va xotira talab qiladi.'
 ],
 find:['Sayt oddiy HTTP orqali ochiladimi va HTTPS ga yo\'naltirish bormi tekshiring.','testssl.sh kabi vosita bilan qanday TLS versiyalari va shifrlar qo\'llab-quvvatlanishini tekshiring.','Agar ma\'lumotlar bazasiga kirish bo\'lsa (laboratoriyada) — parollar nima bilan heshlanganiga qarang.','Kod/repozitoriyda "yozib qo\'yilgan" API kalitlari va sirlarni qidiring.'],
 fix:['Parollarni heshlash uchun Argon2 yoki bcrypt dan foydalaning — hech qachon to\'g\'ridan-to\'g\'ri MD5/SHA1 emas.','Barcha trafikni majburiy ravishda HTTPS ga yo\'naltiring va HSTS ni yoqing.','Eskirgan TLS versiyalarini (1.0/1.1) va zaif shifrlarni o\'chiring.','Sirlarni kodda emas, sirlarni boshqaruvchisida saqlang.'],
 quiz:[
  {q:'Nega MD5 parollarni heshlash uchun yomon tanlov?', opts:['U juda sekin','U tez bo\'lishi uchun mo\'ljallangan, shuning uchun zamonaviy uskunada heshlarni tanlab olish juda tez sodir bo\'ladi','U juda ko\'p xotira talab qiladi','U UTF-8 bilan ishlamaydi'], correct:1, exp:'Tezlik fayl kontrol summalari uchun plyus, lekin parollar uchun katta minus: tanlab olish arzon bo\'lib qoladi.'},
  {q:'Argon2 kabi algoritmni parollar uchun MD5 dan ko\'ra mosroq qiladigan nima?', opts:['Hesh uzunligi qisqaroq','U ataylab sekin va ko\'p xotira talab qiladi, bu tanlab olishni qimmatlashtiradi','U tuz ishlatmaydi','U MD5 dan tezroq'], correct:1, exp:'Argon2 maxsus vaqt va xotira bo\'yicha "qimmat" bo\'lishi uchun loyihalashtirilgan — bu tanlab olishdan himoya.'},
  {q:'HSTS sarlavhasi kriptografiya nuqtai nazaridan nima uchun kerak?', opts:['U ma\'lumotlar bazasini shifrlaydi','U hujumchi urinishida ham brauzerni shifrlanmagan HTTP ga qaytishiga yo\'l qo\'ymaydi','U TLS qo\'l siqishini tezlashtiradi','U cookie ni heshlaydi'], correct:1, exp:'HSTS protokolni HTTP ga tushirish hujumlariga oyna yopadi.'},
  {q:'Quyidagilardan qaysi biri kriptografik nosozlikka misol?', opts:['Ob\'ekt huquqlarini tekshirmaslik','Repozitoriy manba kodida to\'g\'ridan-to\'g\'ri "yozib qo\'yilgan" maxfiy API kaliti','Kirish formasida CAPTCHA yo\'qligi','Ochiq katalog ro\'yxati'], correct:1, exp:'Koddagi kalit erta yoki kech begona qo\'lga tushadi — repozitoriy oqishi, fork, commit tarixi orqali.'}
 ] },
a05:{ t:'A05 · In\'ektsiyalar', short:'Injection', tag:'In\'ektsiya',
 theory:[
 'In\'ektsiya foydalanuvchining tekshirilmagan ma\'lumotlari tarjimonga — SQL, brauzerdagi HTML/JS, operatsion tizim buyrug\'iga — tushganda va u shu ma\'lumotning bir qismini oddiy qiymat emas, kod deb qabul qila boshlaganda yuzaga keladi.',
 'SQL in\'ektsiyasi: agar so\'rov satri birlashtirish orqali tuzilsa ("... WHERE id = " + id), hujumchi id parametriga o\'z SQL qismini qo\'shib, masalan, jadvaldagi barcha qatorlarni yoki umuman boshqa jadvalning o\'zini olishi mumkin.',
 'XSS (Cross-Site Scripting): agar foydalanuvchi kiritgan matn ekranlamasdan HTML sahifaga qo\'yilsa, qurbon brauzeri kiritilgan <script> ni bajaradi. Bu sessiya cookie sini o\'g\'irlash, foydalanuvchi amallarini ushlab qolish, soxta kirish shakllarini ko\'rsatish imkonini beradi.',
 'Ikkalasiga ham asosiy davo — foydalanuvchi ma\'lumotlari bilan satrlardan kod tuzmaslik: SQL uchun parametrlashtirilgan so\'rovlar va brauzerga chiqarish uchun matnli (HTML emas) qo\'yishlar.'
 ],
 find:['?id=1 kabi parametrga bitta qo\'shtirnoq (\') qo\'shing — javobda SQL sintaksis xatosi paydo bo\'ldimi?','Qidiruv maydoniga <script>alert(1)<\/script> kiriting — skript bajariladimi?','Laboratoriyada shubhali parametrda sqlmap ning odatiy yuklarini sinab ko\'ring.','Kiritilgan ma\'lumotlar sahifaga qaytarilganda maxsus belgilar (< > " \') ekranlanadimi tekshiring.'],
 fix:['Parametrlashtirilgan so\'rovlardan (prepared statements) foydalaning — SQL uchun hech qachon satrlarni birlashtirmang.','Kontekstga qarab chiqishni ekranlang/kodlang (HTML, atribut, JS) yoki innerHTML o\'rniga textContent dan foydalaning.','XSS dan qo\'shimcha himoya qatlami sifatida Content-Security-Policy ni joriy qiling.','Kiritilgan ma\'lumotlarni oq ro\'yxat (ruxsat etilgan format) tamoyili bo\'yicha tekshiring, qora ro\'yxat emas.'],
 quiz:[
  {q:'Nega $db->query("SELECT * FROM t WHERE id = " . $_GET[\'id\']) xavfli?', opts:['So\'rov juda sekin bajariladi','$_GET[\'id\'] qiymati shunchaki ma\'lumot emas, SQL kodining bir qismiga aylanadi — hujumchi so\'rov mantiqini o\'zgartira oladi','PHP bunday sintaksisni qo\'llab-quvvatlamaydi','MySQL litsenziyasi bunga yo\'l qo\'ymaydi'], correct:1, exp:'Satrlarni birlashtirish kod va ma\'lumotlarni aralashtiradi — SQL in\'ektsiyalarining klassik sababi.'},
  {q:'Parametrlashtirilgan so\'rov (prepared statement) satrlarni birlashtirishdan nimasi bilan farq qiladi?', opts:['U shunchaki tezroq','Qiymatlar so\'rov matnidan alohida uzatiladi, shuning uchun SQL tuzilmasini o\'zgartira olmaydi','U ma\'lumotlar bazasini talab qilmaydi','U ma\'lumotlarni avtomatik shifrlaydi'], correct:1, exp:'MB drayveri so\'rov kodi va ma\'lumotlarni aniq ajratadi — ma\'lumotlar hech qachon SQL sifatida talqin qilinmaydi.'},
  {q:'box.innerHTML = userInput ni ekranlashsiz qo\'yilsa nima bo\'ladi?', opts:['Hech narsa, innerHTML har doim xavfsiz','Agar userInput <script> ni o\'z ichiga olsa, brauzer bu kodni bajarishi mumkin — bu XSS','Sahifa ochilishdan to\'xtaydi','Bu faqat Internet Explorer da ishlaydi'], correct:1, exp:'innerHTML satrni HTML sifatida talqin qiladi — shu jumladan script/onerror kabi teglarni.'},
  {q:'textContent innerHTML o\'rniga XSS ga qarshi qanday yordam beradi?', opts:['U ma\'lumotni HTML belgilash emas, oddiy matn sifatida qo\'yadi, shuning uchun teglar bajarilmaydi','U tezroq ishlaydi','U ma\'lumotlarni avtomatik ma\'lumotlar bazasiga saqlaydi','U faqat ingliz tilidagi matnni qo\'llab-quvvatlaydi'], correct:0, exp:'textContent mazmunni hech qachon belgilash sifatida talqin qilmaydi — bu shu joyda HTML/JS in\'ektsiyasini ishonchli neytrallaydi.'}
 ] },
a06:{ t:'A06 · Xavfsiz bo\'lmagan dizayn', short:'Insecure Design', tag:'Dizayn',
 theory:[
 'Bu amalga oshirishdagi xatolar emas, arxitektura xatolari haqidagi toifa: hatto mukammal yozilgan kod ham, agar ilova mantig\'ining o\'zi tahdidlarni hisobga olmagan holda loyihalashtirilgan bo\'lsa, xavfsiz bo\'lmasligi mumkin.',
 'Klassik misol — qaror serverda qabul qilinishi kerak bo\'lgan joyda mijozdan keladigan ma\'lumotlarga ishonish. Agar mahsulot narxi buyurtma berish so\'rovining tanasida uzatilsa va server uni shunchaki ishlatsa — qolgan kod qanchalik puxta yozilganidan qat\'i nazar, mantiq allaqachon buzilgan.',
 'Xavfsiz bo\'lmagan dizaynning boshqa misollari: so\'rovlar chastotasini cheklashning yo\'qligi (parollar yoki promo-kodlarni cheklovsiz tanlab olish mumkin), suiiste\'molni hisobga olmaydigan biznes-mantiq (masalan, manfiy miqdordagi mahsulotni buyurtma qilishga ruxsat berish), loyihalash bosqichida tahdidlarni modellashtirishning yo\'qligi.',
 'Bu patch bilan emas, mantiqni qayta ko\'rib chiqish bilan davolanadi: server pul, kirish huquqlari va chegaralarga ta\'sir qiluvchi barcha narsalar uchun yagona haqiqat manbai bo\'lishi kerak.'
 ],
 find:['So\'rov tanasini to\'g\'ridan-to\'g\'ri tahrirlash orqali narx/miqdor/chegirmani o\'zgartirish mumkinligini tekshiring.','Urinishlar soniga cheklov bormi tekshiring (kirish, promo-kod, parolni tiklash).','Ekstremal qiymatlarda nima bo\'lishini o\'ylab ko\'ring: manfiy miqdor, juda katta son, bo\'sh satr.','Butun biznes jarayonini o\'rganing — so\'rovlar tartibini o\'zgartirib tekshiruvni chetlab o\'tish mumkin bo\'lgan qadam bormi?'],
 fix:['Pul va huquqlarga ta\'sir qiluvchi hamma narsani serverda qayta hisoblang — mijozdan kelgan qiymatlarga hech qachon ishonmang.','Nozik amallarga (kirish, parolni tiklash, promo-kodlar) rate limiting qo\'shing.','"Agar foydalanuvchi kutilmagan narsa yuborsa" ni hisobga olib loyihalashtiring — shu jumladan yovuz niyatli foydalanuvchi.','Muhim funksiyalar uchun kod yozishdan oldin tahdidlarni modellashtiring (threat modeling).'],
 quiz:[
  {q:'"Xavfsiz bo\'lmagan dizayn" va "in\'ektsiya" o\'rtasidagi farq nima?', opts:['Bu bir xil narsa','In\'ektsiya — amalga oshirish xatosi (kod qanday yozilgan); xavfsiz bo\'lmagan dizayn — kod puxta yozilgan bo\'lsa ham, mantiq/arxitekturaning o\'zidagi xato','Xavfsiz bo\'lmagan dizayn faqat interfeys (UI) dizayniga tegishli','In\'ektsiya har doim jiddiyroq'], correct:1, exp:'Xavfsiz bo\'lmagan dizayn — bu kodda yozuv xatosi emas, "bu qanday ishlashi kerak" darajasidagi qarorlar muammosi.'},
  {q:'Nega mijoz so\'rovi tanasidan mahsulot narxini qabul qilish xavfsiz bo\'lmagan dizaynga misol?', opts:['Bu shunchaki frontend uchun noqulay','Server narx uchun haqiqat manbai bo\'lishi kerak — aks holda foydalanuvchi istalgan sonni qo\'yishi mumkin','JSON o\'nlik sonlarni qo\'llab-quvvatlamaydi','Bu faqat unumdorlikka bog\'liq'], correct:1, exp:'Agar muhim qiymat mijozdan kelsa va server uni qayta hisoblamasa — mantiq kod sifatidan qat\'i nazar allaqachon buzilgan.'},
  {q:'Kirish formasida rate limiting nima uchun kerak?', opts:['Sayt tezroq ishlashi uchun','Avtomatik urinishlar bilan parolni tanlab olishni qiyinlashtirish uchun','Ma\'lumotlar bazasi hajmini kamaytirish uchun','Bu HTTPS talabi'], correct:1, exp:'Urinishlar sonini cheklamasa, parolni cheksiz uzoq va tez tanlab olish mumkin.'},
  {q:'Threat modeling (tahdidlarni modellashtirish) nima?', opts:['Sayt unumdorligini sinash','Oldindan o\'ylab ko\'rilgan tahlil: tizimga kim, qanday hujum qilishi mumkin va arxitekturada nimani hisobga olish kerak','Ilova uchun logotip dizayni','Kodda xatolarni avtomatik skanerlash'], correct:1, exp:'Threat modeling — bu skanerlash vositasi emas, loyihalash qadami; u nafaqat "qatorlardagi" balki arxitekturaviy muammolarni ham yopadi.'}
 ] },
a07:{ t:'A07 · Autentifikatsiya nosozliklari', short:'Authentication Failures', tag:'Autentifikatsiya',
 theory:[
 'Autentifikatsiya — "siz kimsiz" ni tasdiqlash jarayoni. Bu yerdagi nosozliklar hujumchiga boshqa foydalanuvchi bo\'lib ko\'rinish imkonini beradi: parolni tanlab olish, sessiyani o\'g\'irlash, shaxsni tekshirishni chetlab o\'tish.',
 'Odatiy muammolar: kirish urinishlari soniga cheklovning yo\'qligi (parollarni tanlab olish mumkin), parolga zaif talablar, kirishdan keyin sessiya identifikatori yangilanmasligi (session fixation), sessiya muddati tugamasligi va qurilma/IP ga oqilona bog\'lanmagan holda saqlanishi, "parolni unutdim" yoki ko\'p faktorli autentifikatsiyani amalga oshirishdagi xatolar.',
 'Parollarni == orqali yoki timing hujumlaridan himoyasiz taqqoslash ham shu yerga tegishli — javob vaqti bo\'yicha parolning necha belgisi to\'g\'ri topilganini bilvosita bilib olish mumkin.'
 ],
 find:['Bloklash/kechikishsiz ketma-ket ko\'p marta noto\'g\'ri parol kiritish mumkinligini tekshiring.','Muvaffaqiyatli kirishdan keyin sessiya ID (cookie) o\'zgaradimi qarang.','Parol siyosatini tekshiring — "123456" parol qabul qilinadimi?','Parolni tiklash shaklini tekshiring — u shunday email bilan akkaunt mavjudligini oshkor qilmaydimi?'],
 fix:['Kirish urinishlari sonini cheklang (rate limiting, N marta muvaffaqiyatsizlikdan keyin vaqtinchalik bloklash).','Muvaffaqiyatli kirishdan keyin har doim yangi sessiya yarating (session.clear() + yangi ID).','Parolning minimal murakkabligini talab qiling va uni oshkor bo\'lgan bazalar bo\'yicha tekshiring.','Nozik amallar uchun ko\'p faktorli autentifikatsiyadan foydalaning.'],
 quiz:[
  {q:'Agar sayt kirish urinishlari sonini cheklamasa, nima bo\'ladi?', opts:['Hech narsa, bu xavfsizlik muammosi emas','Hujumchi parollarni avtomatik tanlab olishi mumkin (brute force) hech qanday to\'siqsiz','Sayt tezroq ishlaydi','Bu faqat CSS yukini oshiradi'], correct:1, exp:'Urinishlarni cheklamasa, parolni tanlab olish vaqt va hisoblash resurslari masalasiga aylanadi.'},
  {q:'Session fixation nima?', opts:['Foydalanuvchi parolni unutgan','Kirishdan keyin sessiya ID o\'zgarmaydi va hujumchi qurbonga oldindan ma\'lum sessiya ID sini majburlaydi','Sessiya juda tez tugaydi','Cookie mobil brauzerda ishlamaydi'], correct:1, exp:'Agar server kirishdan keyin yangi sessiya ID bermasa, oldindan ma\'lum ID qurbon sessiyasini ushlab olish uchun ishlatilishi mumkin.'},
  {q:'"Parolni unutdim" shakli email bazada mavjudligini nega aytmasligi kerak?', opts:['Bu GDPR standart talabi','Aks holda hujumchi mavjud akkauntlar ro\'yxatini tuzishi mumkin (username enumeration)','Shunda sayt tezroq yuklanadi','Bu xavfsizlikka aloqasi yo\'q'], correct:1, exp:'"Email topildi" / "email topilmadi" uchun turli javoblar haqiqiy foydalanuvchilarni sanab chiqish imkonini beradi.'},
  {q:'Foydalanuvchi muvaffaqiyatli kirgandan so\'ng darhol nima qilish kerak?', opts:['Hech narsa alohida','Yangi sessiya yaratish (ID ni yangilash), eskisini qayta ishlatmaslik','Loglashni o\'chirish','Tezlashtirish uchun TLS darajasini pasaytirish'], correct:1, exp:'Kirishdan keyingi yangi sessiya session fixation kabi hujumlarni yopadi.'}
 ] },
a08:{ t:'A08 · Dasturiy ta\'minot va ma\'lumotlar yaxlitligi nosozliklari', short:'Software or Data Integrity Failures', tag:'Yaxlitlik',
 theory:[
 'Bu toifa ilova hech kim yaxlitligini tekshirmagan ma\'lumot yoki kodga ishonganda nima bo\'lishi haqida. Klassik misol — xavfsiz bo\'lmagan deserializatsiya: server bayt oqimini (ko\'pincha foydalanuvchi tomonidan, masalan cookie da yuborilgan) dastur ob\'ektlariga qayta aylantiradi, va agar format nafaqat ma\'lumotni, balki "ko\'rsatmalarni" ham kodlashga imkon bersa, hujumchi ixtiyoriy kodni bajartirishga erishishi mumkin.',
 'Misol — Python pickle: u deyarli har qanday ob\'ektni, shu jumladan funksiya chaqiruvlarini seriyalashtira oladi. Agar ilova cookie dan olingan ma\'lumotlarda pickle.loads() ni bajarsa, maxsus tuzilgan bayt to\'plami serverga deserializatsiya paytida hujumchi kodini bajartirishga majbur qiladi.',
 'Bunga raqamli imzoni tekshirmasdan avtoyangilanishlar va tekshirilmagan artefaktlarga ishonuvchi CI/CD quvurlari — ya\'ni istalgan shaklda "kelib chiqishini tekshirmasdan ishonish" ham tegishli.'
 ],
 find:['Ilova cookie yoki parametrlarda seriyalashtirilgan ob\'ektlardan (pickle, PHP serialize, Java ob\'ektlari) foydalanadimi tekshiring.','Yangilanish yoki yig\'ish artefaktini qo\'llashdan oldin imzo/kontrol summasi tekshiriladimi tekshiring.','Cookie dagi seriyalashtirilgan ma\'lumotlarni o\'zgartirib, serverning reaksiyasiga qarang.'],
 fix:['Ishonchsiz ma\'lumotlarni "xavfli" formatlarga (pickle, PHP unserialize) deserializatsiya qilmang — bajariladigan konstruksiyalarsiz xavfsiz ma\'lumot formatlaridan (JSON) foydalaning.','Muhim ma\'lumotlarni imzolang (HMAC) va ishlatishdan oldin imzoni tekshiring.','Qo\'llashdan oldin yangilanishlar va yig\'ish artefaktlari uchun raqamli imzolarni tekshiring.'],
 quiz:[
  {q:'Foydalanuvchi cookie sidagi ma\'lumotlarda pickle.loads() ning asosiy xavfi nimada?', opts:['Bu shunchaki sekin','Pickle formati nafaqat ma\'lumotni, balki ob\'ekt chaqiruvlarini ham kodlashi mumkin — hujumchi o\'z kodini bajartirishga erishishi mumkin','Cookie 4 KB bilan cheklangan','Pickle faqat raqamlar bilan ishlaydi'], correct:1, exp:'Xavfsiz bo\'lmagan deserializatsiya — eng xavfli zaiflik sinflaridan biri: ma\'lumotni o\'qishdan RCE (masofadan kod bajarish) gacha.'},
  {q:'HMAC imzosi seriyalashtirilgan ma\'lumotlarni soxtalashtirishdan qanday himoya qiladi?', opts:['U ma\'lumotni siqadi','U serverga ma\'lumot imzolangan paytdan beri o\'zgartirilmaganligini tekshirish imkonini beradi — soxtalashtirish aniqlanadi','U deserializatsiyani tezlashtiradi','U HTTPS zaruratini almashtiradi'], correct:1, exp:'Agar imzo mos kelmasa, server ma\'lumotni deserializatsiya qilishdan oldin rad etadi.'},
  {q:'Nega JSON mijozdan ma\'lumot uzatish uchun umuman pickle dan xavfsizroq?', opts:['JSON tezroq tahlil qilinadi','JSON faqat ma\'lumotlar uchun format, u "funksiya chaqiruvi" yoki ixtiyoriy ob\'ektni kodlay olmaydi','JSON ichma-ich ob\'ektlarni qo\'llab-quvvatlamaydi','Bu unday emas, ikkalasi ham bir xil xavfli'], correct:1, exp:'JSON faqat ma\'lumot tuzilmalarini (raqamlar, satrlar, ro\'yxatlar, ob\'ektlar) tasvirlaydi — unda "kodni bajarish" mexanizmi yo\'q.'},
  {q:'Quyidagilardan qaysi biri dasturiy ta\'minot yaxlitligi nosozligiga misol?', opts:['HTTPS yo\'qligi','Nashriyotchining raqamli imzosini tekshirmasdan paketni o\'rnatadigan avtoyangilanish','Juda uzun parol','Ochiq katalog ro\'yxati'], correct:1, exp:'Agar yangilanish imzo bo\'yicha tekshirilmasa, almashtirilgan zararli paket "rasmiy" sifatida o\'rnatilishi mumkin.'}
 ] },
a09:{ t:'A09 · Loglash va ogohlantirish nosozliklari', short:'Logging & Alerting Failures', tag:'Monitoring',
 theory:[
 'Bu toifa hujumchi qanday kirib borishi haqida emas — buni kimdir sezayaptimi haqida. Agar ilova muvaffaqiyatsiz kirish urinishlarini, kirish huquqlari o\'zgarishlarini, shubhali so\'rovlarni loglamasa, hujum oylar davomida sezilmasdan davom etishi mumkin.',
 'Muammoning ikkinchi tomoni — ortiqcha loglash: agar logga parollar, sessiya tokenlari, karta raqamlari tushsa, logning o\'zi qimmatli nishonga va oqish manbaiga aylanadi. Yaxshi loglash voqeani ("X foydalanuvchisi uchun Y IP dan muvaffaqiyatsiz kirish urinishi bo\'ldi") qayd etadi, lekin sirlarni emas.',
 'Ogohlantirishsiz loglar ham foydasiz — agar bir daqiqada 500 ta muvaffaqiyatsiz kirish urinishi hech kimni xabardor qilmasa, hodisani faqat "faktdan keyin" — zarar allaqachon yetkazilganidan keyin loglarni tahlil qilib topish mumkin.'
 ],
 find:['Muvaffaqiyatsiz kirish urinishlari qanday tafsilot bilan loglanayotganini tekshiring.','Manba kodda/loglarda parollar yoki tokenlar ochiq holda tushmayaptimi qidiring.','Shubhali faoliyat ko\'tarilganda avtomatik ogohlantirishlar bormi tekshiring.'],
 fix:['Xavfsizlik voqealarini loglang: kirish/chiqish, huquqlar o\'zgarishi, rad etilgan so\'rovlar — ochiq sirlarsiz.','Anomaliyalarga (masalan, bitta IP dan ko\'p muvaffaqiyatsiz kirish urinishlari) ogohlantirishlarni sozlang.','Loglarni markazlashtiring va himoyalang — ular o\'zi nozik ma\'lumotdir.'],
 quiz:[
  {q:'Nega foydalanuvchi parolini logga yozish yomon amaliyot, hatto log "faqat debagging uchun" saqlansa ham?', opts:['Bu muammo emas, agar log e\'lon qilinmasa','Log siring ochiq holda saqlanadigan yana bir joyga aylanadi — log oqishi = parollar oqishi','Bu loglarni yozishni sekinlashtiradi','Loglar avtomatik shifrlanadi'], correct:1, exp:'Loglar ko\'pincha asosiy ma\'lumotlar bazasidan kamroq himoyalangan va uzoqroq saqlanadi — undagi sirlar xavfni oshiradi.'},
  {q:'Agar ilova muvaffaqiyatsiz kirish urinishlarini loglamasa, nima bo\'ladi?', opts:['Jiddiy hech narsa','Parolni tanlab olish (brute force) sezilmasdan istalgancha davom etishi mumkin','Sayt tezroq ishlaydi','Bu GDPR talabi loglashni taqiqlaydi'], correct:1, exp:'Loglar va ogohlantirishlarsiz xavfsizlik jamoasida hujum sodir bo\'layotgani haqida signal yo\'q.'},
  {q:'Nega faqat loglarning o\'zi emas, ogohlantirishlar ham kerak?', opts:['Loglar yuritilsa, ogohlantirishlar kerak emas','Monitoringsiz loglar faqat hodisadan keyin aniqlanadi — ogohlantirish real vaqtda javob berish imkonini beradi','Ogohlantirishlar loglash zaruratini almashtiradi','Ogohlantirishlar faqat marketing uchun kerak'], correct:1, exp:'Real vaqtda hech kim o\'qimaydigan passiv log ko\'pincha loglash yo\'qligi bilan barobar.'},
  {q:'Quyidagilardan qaysi biri xavfsizlik loglarida yaxshi yozuv namunasi?', opts:['login_failed user=admin ip=203.0.113.5','login attempt password=Sup3rSecret!','GET /api/session token=eyJhbGciOi...','User-Agent: Mozilla/5.0 (sabab sizsiz sarlavhalarning to\'liq dampi)'], correct:0, exp:'Foydali yozuv voqea va kontekstni (kim, qayerdan) tasvirlaydi, lekin sirning o\'zini o\'z ichiga olmaydi.'}
 ] },
a10:{ t:'A10 · Istisno holatlarni noto\'g\'ri qayta ishlash', short:'Mishandling of Exceptional Conditions', tag:'Xatolar',
 theory:[
 'Bu 2025-yilning yangi toifasi: nimadir noto\'g\'ri ketganda nima bo\'lishi haqida — xizmat mavjud emas, tekshiruv istisno tashlaydi, kirish ma\'lumotlari kutilganidek emas. Yaxshi loyihalashtirilgan tizim xavfsiz "yiqilishi" kerak (fail closed), standart bo\'yicha kirishni ochib qo\'yishi emas (fail open).',
 'Ishlab chiqish dunyosidan klassik misol — try/catch ga o\'ralgan huquqlarni tekshirish, bunda catch bloki xato bilan false o\'rniga true ("ruxsat berish") qaytaradi, "har ehtimolga qarshi, foydalanuvchi ishini buzmaslik uchun". Agar huquqlarni tekshirish xizmati vaqtincha mavjud bo\'lmasa, bu hammaga kirishni ochib qo\'yadi.',
 'Bunga ma\'lumotlar oqishiga olib keluvchi tekshirilmagan istisnolarni qayta ishlash (javobda infratuzilma tafsilotlari bilan stack-trace), bitta qayta ishlanmagan xato tufayli butun xizmatning yiqilishi, yoki hech kim ko\'zda tutmagan nostandart kiritish orqali biznes-mantiqni chetlab o\'tish ham tegishli.'
 ],
 find:['Huquq/imzo tekshiruvi try/catch ga o\'ralgan joylarni toping — xato bo\'lganda nima qaytariladi?','Serverga bila turib "buzilgan" ma\'lumotlar (bo\'sh tana, noto\'g\'ri tur, juda uzun satr) yuboring — xizmat qanday reaksiya bildiradi?','Bog\'liq xizmat (ma\'lumotlar bazasi, tashqi API) mavjud bo\'lmaganda xatti-harakatni tekshiring — xizmat "yopiq holda yiqiladimi" yoki kirishni ochib qo\'yadimi?'],
 fix:['Xatolarni qayta ishlashni fail closed tamoyili bo\'yicha loyihalashtiring — nosozlikda kirish standart bo\'yicha taqiqlanadi.','Istisnolarni loglang, lekin foydalanuvchiga ichki tafsilotlarni ko\'rsatmang.','Faqat "baxtli yo\'l" uchun emas, maxsus "yomon" va kutilmagan kirish ma\'lumotlari uchun testlar yozing.','Bir komponentning vaqtinchalik mavjud emasligi hamma joyda kirishni ochib qo\'ymasligini tekshiring.'],
 quiz:[
  {q:'Xavfsizlik xatolarini qayta ishlash kontekstida "fail closed" nimani anglatadi?', opts:['Tekshiruv muvaffaqiyatsiz bo\'lganda kirish standart bo\'yicha ruxsat etiladi','Tekshiruv muvaffaqiyatsiz bo\'lganda kirish standart bo\'yicha taqiqlanadi — tizim "yopiladi", ochilmaydi','Har qanday xatoda xizmat to\'liq to\'xtaydi','Bu fail open bilan bir xil'], correct:1, exp:'Fail closed shuni anglatadi: agar tekshiruv bajarilmasa, ruxsat berishdan ko\'ra rad etish xavfsizroq.'},
  {q:'Nega huquqlarni tekshirish funksiyasida catch (e) { return true; } xavfli?', opts:['Bu sintaksis xatosi','Tekshiruvning har qanday nosozligida (masalan, xizmat mavjud emasligida) funksiya "har ehtimolga qarshi" hammaga kirishni ruxsat beradi','Bu funksiya bajarilishini sekinlashtiradi','TypeScript bunday yozishga yo\'l qo\'ymaydi'], correct:1, exp:'Bu klassik fail open misoli — boshqa joydagi xato kirishni nazorat qilishdagi teshikka aylanadi.'},
  {q:'Nega ilovani bila turib "yomon" kiritish ma\'lumotlarida sinash kerak?', opts:['Kod oddiy testlardan o\'tsa, bu kerak emas','Qayta ishlanmagan istisno ma\'lumotlar oqishiga yoki mantiqni chetlab o\'tishga olib kelmayotganini ko\'rish uchun','Hisobot uchun test qamrovini oshirish uchun','Bu faqat mobil ilovalar uchun talab qilinadi'], correct:1, exp:'Aynan nostandart/kutilmagan kiritishda istisnolarni qayta ishlash xatolari ko\'pincha namoyon bo\'ladi.'},
  {q:'Quyidagilardan qaysi biri tashqi imzo tekshirish xizmati mavjud emasligiga to\'g\'ri reaksiya?', opts:['Tekshiruvni o\'tkazib yuborib, oddiygidek davom etish','Xizmat tiklanguncha amalni rad etish (fail closed)','Diskni to\'ldirmaslik uchun loglashni o\'chirish','Foydalanuvchi huquqlarini avtomatik oshirish'], correct:1, exp:'Agar muhim tekshiruv bajarilmasa, hammasini ruxsat berishdan ko\'ra vaqtincha rad etish xavfsizroq.'}
 ] }
},
tools:{
 burp:{ blurb:'Grafik interfeysli proksi-perexvatchik: brauzer trafigining barchasi undan o\'tadi, siz har bir so\'rovni serverga yuborishdan oldin ko\'rishingiz va o\'zgartirishingiz mumkin.', guiNote:'Bu grafik ilova — uni ushbu saytdagi brauzer terminalida ishga tushirib bo\'lmaydi. Burp\'ni o\'z kompyuteringizga o\'rnating va ataylab zaif qilib qo\'yilgan stendlarda (masalan, OWASP Juice Shop yoki DVWA) mashq qiling, boshqa birovning saytida emas.', steps:['Burp Suite Community ni o\'rnating va ishga tushiring.','Brauzerni 127.0.0.1:8080 proksisidan foydalanishga sozlang (yoki Burp ichidagi tayyor Chromium\'ni oching — u allaqachon sozlangan).','HTTPS trafigini ogohlantirishlarsiz ko\'rish uchun Burp sertifikatini (Proxy → CA Certificate) brauzerga o\'rnating.','Target bo\'limida kerakli domenni Scope\'ga qo\'shing — shunda tarix keraksiz trafik bilan to\'lib ketmaydi.','Proxy → Intercept is on ni yoqing — endi har bir so\'rov yuborishdan oldin to\'xtaydi va uni tahrirlash mumkin.','Proxy → HTTP history dan kerakli so\'rovni topib, Repeater ga yuboring (Ctrl+R).','Repeater da parametrlarni qo\'lda o\'zgartirib, so\'rovni qayta yuboring va javoblarni solishtiring — IDOR va mantiqni tekshirish uchun qulay.','Qiymatlarni avtomatik sinash uchun Intruder dan foydalaning: payload pozitsiyasini belgilang va qiymatlar ro\'yxatini (masalan, foydalanuvchi ID lari) ulang.','Target → Site map bo\'limi asta-sekin butun o\'rganilgan sayt xaritasini quradi.'] },
 zap:{ blurb:'OWASP ning bepul skaneri va proksisi — odatiy zaifliklarni avtomatik qidiradi va Burp dagi kabi saytni qo\'lda o\'rganish imkonini beradi.', guiNote:'Bu ham grafik ilova — brauzer terminalida ishlamaydi. ZAP ni mahalliy o\'rnating va maxsus zaif stendlarda mashq qiling.', steps:['OWASP ZAP ni o\'rnating.','Boshlang\'ich ekranda «URL to Attack» maydoniga sayt manzilini kiriting.','Automated Scan ni ishga tushiring — u havolalarni o\'zi aylanib chiqadi (spider) va topganini skanerlaydi (active scan).','Alerts bo\'limini o\'rganing — topilmalar jiddiylik darajasi bo\'yicha guruhlangan (High/Medium/Low/Info).','Qo\'lda o\'rganish uchun brauzerni ZAP proksisiga (odatda 127.0.0.1:8080) sozlang yoki HUD ni yoqing — shunda trafik Burp dagidek jonli ko\'rinadi.','History bo\'limi barcha ushlangan so\'rovlarni tartib bilan ko\'rsatadi — kerakli birini topish qulay.','Spider ni alohida ishga tushirib, avval sayt xaritasini qurish, keyin nimani skanerlashni qo\'lda tanlash mumkin.','Active Scan ni butun sayt o\'rniga daraxtning bitta aniq tuguniga ishga tushirish mumkin.'] },

 nikto:{ blurb:'Veb-server avtomatik skaneri — minglab ma\'lum muammoli fayllar, konfiguratsiyalar va eskirgan dasturiy ta\'minotni tekshiradi.', steps:['nikto ni o\'rnating.','Maqsad hostni skanerlashdan o\'tkazing.','Topilgan muammolar hisobotini o\'rganing.'] },
 curl:{ blurb:'HTTP so\'rovlari uchun buyruqlar qatori vositasi — qo\'lda sinashning asosi: sarlavhalar, javob tanasi, istalgan metod va parametrlar.', steps:['Javob sarlavhalarini so\'rang.','Muayyan sahifani to\'liq so\'rang.','So\'rov parametrlarini o\'zgartirib, server reaksiyasiga qarang.'] },

vulns:{
a01:{ t:'A01 · Broken Access Control', short:'Broken Access Control', tag:'Access',
 theory:[
 'Access control is the set of checks that decide what a specific user is allowed to do: which pages they can see, whose data they can read, which actions they can perform. "Broken access control" means the server performs an action or returns data without properly checking whether the user is actually entitled to it.',
 'The most common example is IDOR (Insecure Direct Object Reference): a request contains an object identifier (e.g. /api/orders/1001), and the server just returns the object by ID without checking whether it belongs to the current user. Change the number in the URL and you see someone else\'s order.',
 'This category also covers reaching "hidden" admin URLs directly, privilege escalation by swapping a role=user parameter to role=admin, and SSRF (Server-Side Request Forgery) — where the server itself makes a request to a URL supplied by the user, which can be used to reach internal-only services.',
 'In 2025 this is category #1 — it shows up in almost every tested application, because it\'s easy to forget an ownership check in just one of dozens of request handlers.'
 ],
 find:['Change numeric IDs in the URL and request body — does someone else\'s data show up?','Look at parameters like role, isAdmin, userId that come from the client — does the server trust them?','Try reaching admin endpoints (/admin, /api/admin/...) as a regular user.','Check whether the server accepts a URL from the user and fetches it itself (SSRF) — e.g. a "webhook URL" or "import image from a link" field.'],
 fix:['Check object ownership on the server for every request, not just in the UI.','Use a "deny by default" policy — access is granted only explicitly.','Never trust a role/permission sent by the client — read it from the server-side session.','For "server fetches a user-supplied URL" flows, use a host allowlist.'],
 quiz:[
  {q:'A user changes /api/invoice/2048 to /api/invoice/2049 in the address bar and sees someone else\'s invoice. What is this vulnerability called?', opts:['SQL injection','IDOR (Insecure Direct Object Reference)','XSS','CSRF'], correct:1, exp:'The server returned an object by ID without checking the owner — a classic IDOR, a specific case of broken access control.'},
  {q:'Which check best protects against IDOR?', opts:['Hide the ID by replacing it with a random string','Check on the server that the object belongs to the current user','Add a CAPTCHA to the form','Use HTTPS'], correct:1, exp:'A "hidden" ID can be discovered or brute-forced — the only reliable defense is an explicit ownership check on the server.'},
  {q:'What is SSRF?', opts:['Forging a request on behalf of a user (CSRF)','The server itself sends a request to a URL supplied by the user','Malicious script running in the victim\'s browser','A weak password hashing algorithm'], correct:1, exp:'In SSRF, an attacker makes the server itself reach an address it wants, e.g. an internal network.'},
  {q:'Why shouldn\'t a "role=admin" check trust a parameter from the client\'s request?', opts:['Because it\'s slow','Because the client can send any value — the server must read the role from its own session','Because JSON doesn\'t support booleans','It\'s fine as long as HTTPS is used'], correct:1, exp:'Client-supplied data is entirely under the attacker\'s control; the server must be the source of truth for permissions.'}
 ] },
a02:{ t:'A02 · Security Misconfiguration', short:'Security Misconfiguration', tag:'Config',
 theory:[
 'This category covers "default" settings, unnecessary features, and configuration mistakes: directory listing left on, test pages left in production, verbose error messages with stack traces, exposed .git or .env files, unneeded HTTP methods, missing security headers.',
 'The problem isn\'t one flaw in the code — it\'s that the server reveals too much about itself (version banners, service files) or allows more than it should. That\'s why this category rose to #2 in 2025 — it touches literally every deployment.',
 'A typical scenario: a developer left autoindex on in nginx — and an entire folder of database backups became reachable via a direct link. Or a .env file with database credentials ended up in the site root and gets served as a plain text file.'
 ],
 find:['Check /.git/HEAD, /.env, /backup.zip, /config.php.bak — are internal files being served?','Look at the response headers (curl -I) — is a server/framework version visible?','Try opening a folder with no index file — is listing enabled?','Request a nonexistent path — does a stack trace leak server file paths?'],
 fix:['Disable directory listing and version disclosure (server_tokens off).','Remove service files and .git from the public folder, and explicitly deny access to them.','Show the user a generic error page — keep details in server-side logs only.','Add security headers: HSTS, X-Content-Type-Options, CSP.'],
 quiz:[
  {q:'Which of these is an example of security misconfiguration?', opts:['A SQL query built with string concatenation','An exposed /.git/ folder on a production server','A weak MD5 hashing algorithm','Missing ownership check on an object'], correct:1, exp:'An exposed .git folder is a leak caused by server configuration, not a business-logic bug.'},
  {q:'Why turn off detailed stack traces shown to users?', opts:['It speeds up the site','It can reveal server file paths, library versions, and code structure — hints for an attack','It\'s an HTTP protocol requirement','It has no effect on security'], correct:1, exp:'A detailed error is free reconnaissance for an attacker.'},
  {q:'What does the Strict-Transport-Security (HSTS) header do?', opts:['Encrypts passwords in the database','Forces the browser to always reach the site over HTTPS only','Blocks SQL injection','Rate-limits requests'], correct:1, exp:'HSTS protects against downgrading the connection to unencrypted HTTP.'},
  {q:'Why is directory listing (autoindex on) dangerous?', opts:['It shows the file list of a folder to every visitor, including accidentally left backups and configs','It slows down the server','It increases HTML page size','It interferes with search engine indexing'], correct:0, exp:'Listing turns any folder without an index file into a public file browser.'}
 ] },
a03:{ t:'A03 · Software Supply Chain Failures', short:'Software Supply Chain Failures', tag:'Dependencies',
 theory:[
 'A modern application is almost entirely someone else\'s code: libraries, packages, Docker images, CI/CD scripts. A "supply chain failure" means the attacker compromises not your code directly, but something it depends on.',
 'Attacks take different forms: a vulnerable library version with a known CVE that never got updated; dependency confusion (a public package sharing an internal package\'s name but with a higher version number — the package manager pulls the malicious public one); a compromised CI/CD pipeline that quietly injects a backdoor into every build.',
 'In 2025 this is a new standalone category — previously the topic was just "outdated components," now it covers the entire lifecycle: where a package came from, who signed it, whether the build is reproducible.'
 ],
 find:['Check package.json/requirements.txt — any "*" or "latest" instead of pinned versions?','Run a dependency vulnerability scanner (e.g. trivy) — any known CVEs?','Look at the CI config — are scripts downloaded and run without checksum/signature verification?','Check whether the lockfile (package-lock.json) is committed to the repository.'],
 fix:['Pin exact dependency versions and commit the lockfile.','Regularly scan dependencies and update components with known vulnerabilities.','Never download and run installer scripts without verifying a signature/hash.','Use a private package registry with priority over the public one to rule out dependency confusion.'],
 quiz:[
  {q:'What is dependency confusion?', opts:['A typo in a variable name','A public package with the same name and a higher version than an internal one — the package manager installs it instead of the private one','A forgotten npm account password','Using two different programming languages in one project'], correct:1, exp:'The attack relies on version precedence: if the public version looks "newer," many package managers will pick it.'},
  {q:'Why is "express": "*" in package.json a bad practice?', opts:['It makes the project heavier','Any new version — including a malicious or vulnerable one — will be installed automatically','It\'s outdated JSON syntax','It only affects install speed'], correct:1, exp:'An unpinned version removes control over exactly which code ends up in your build.'},
  {q:'Why commit the lockfile (package-lock.json) to the repository?', opts:['To reduce repository size','So everyone and CI install the same, verified dependency versions','It\'s an MIT license requirement','To speed up the IDE'], correct:1, exp:'The lockfile pins the dependency tree — the build becomes reproducible and predictable.'},
  {q:'Which of these is a CI/CD pipeline security practice?', opts:['curl https://get.example.sh | bash with no verification','Downloading an installer and checking its checksum before running it','Storing all secrets directly in the pipeline code','Turning off build logging'], correct:1, exp:'Checking a hash/signature prevents a tampered or compromised script from running unnoticed.'}
 ] },
a04:{ t:'A04 · Cryptographic Failures', short:'Cryptographic Failures', tag:'Crypto',
 theory:[
 'This is about how data is (or isn\'t) protected at rest and in transit: passwords, card numbers, session tokens, personal data. This category used to be called "sensitive data exposure" — the focus has since shifted to the root cause: weak or missing cryptography.',
 'Common mistakes: passwords stored in plaintext or hashed with a fast, unsalted algorithm (MD5, SHA1) — such hashes are cracked in seconds on a GPU; a site allowing plain HTTP instead of HTTPS; homemade or outdated encryption algorithms; secret keys hardcoded into source code.',
 'The right approach for passwords is slow, purpose-built algorithms (Argon2, bcrypt, scrypt) with a salt, which deliberately demand significant time and memory per attempt.'
 ],
 find:['Check whether the site is reachable over plain HTTP, and whether it redirects to HTTPS.','Use a tool like testssl.sh to see which TLS versions and ciphers are supported.','If you have database access (in a lab) — check what algorithm is used to hash passwords.','Search the code/repository for hardcoded API keys and secrets.'],
 fix:['Use Argon2 or bcrypt for password hashing — never MD5/SHA1 directly.','Force-redirect all traffic to HTTPS and enable HSTS.','Disable outdated TLS versions (1.0/1.1) and weak ciphers.','Store secrets in a secrets manager, not in code.'],
 quiz:[
  {q:'Why is MD5 a poor choice for hashing passwords?', opts:['It\'s too slow','It\'s designed to be fast, so brute-forcing the hashes happens very quickly on modern hardware','It uses too much memory','It doesn\'t work with UTF-8'], correct:1, exp:'Speed is a plus for file checksums but a huge downside for passwords — it makes brute-forcing cheap.'},
  {q:'What makes an algorithm like Argon2 more suitable for passwords than MD5?', opts:['It has a shorter hash length','It is deliberately slow and memory-hungry, which makes brute-forcing expensive','It doesn\'t use a salt','It\'s faster than MD5'], correct:1, exp:'Argon2 is specifically designed to be "expensive" in time and memory — that\'s exactly the defense against brute-forcing.'},
  {q:'Why does the HSTS header matter for cryptography?', opts:['It encrypts the database','It prevents the browser from falling back to unencrypted HTTP, even under attack','It speeds up the TLS handshake','It hashes cookies'], correct:1, exp:'HSTS closes the window for protocol-downgrade attacks to HTTP.'},
  {q:'Which of these is an example of a cryptographic failure?', opts:['No ownership check on an object','A secret API key hardcoded directly into the repository\'s source code','No CAPTCHA on the login form','Directory listing enabled'], correct:1, exp:'A key in the code will sooner or later end up in the wrong hands — via a repo leak, a fork, or commit history.'}
 ] },
a05:{ t:'A05 · Injection', short:'Injection', tag:'Injection',
 theory:[
 'Injection happens when unvalidated user data reaches an interpreter — SQL, HTML/JS in the browser, an OS command — and part of that data starts being treated as code rather than a plain value.',
 'SQL injection: if a query string is built by concatenation ("... WHERE id = " + id), an attacker can append their own SQL to the id parameter and, for example, retrieve every row in a table — or an entirely different table.',
 'XSS (Cross-Site Scripting): if user-supplied text is inserted into an HTML page without escaping, the victim\'s browser will execute the injected <script>. This allows stealing session cookies, hijacking user actions, and showing fake login forms.',
 'The core fix for both is to never build code from strings containing user data: parameterized queries for SQL, and text (not HTML) insertion for anything written back into the browser.'
 ],
 find:['Add a single quote (\') to a parameter like ?id=1 — does a SQL syntax error appear in the response?','Enter <script>alert(1)<\/script> into a search box — does the script execute?','Try sqlmap\'s standard payloads against a suspicious parameter in a lab environment.','Check whether special characters (< > " \') are escaped when user input is echoed back onto the page.'],
 fix:['Use parameterized queries (prepared statements) — never string concatenation for SQL.','Escape/encode output based on context (HTML, attribute, JS), or use textContent instead of innerHTML.','Add a Content-Security-Policy as an extra layer of defense against XSS.','Validate input using an allowlist of accepted formats, not a denylist.'],
 quiz:[
  {q:'Why is $db->query("SELECT * FROM t WHERE id = " . $_GET[\'id\']) dangerous?', opts:['The query runs too slowly','The value of $_GET[\'id\'] becomes part of the SQL code, not just data — an attacker can change the query\'s logic','PHP doesn\'t support this syntax','MySQL\'s license forbids it'], correct:1, exp:'String concatenation mixes code and data — the classic cause of SQL injection.'},
  {q:'How does a parameterized query (prepared statement) differ from string concatenation?', opts:['It\'s simply faster','Values are sent separately from the query text, so they can\'t alter the SQL structure','It doesn\'t require a database','It automatically encrypts the data'], correct:1, exp:'The DB driver cleanly separates query code from data — the data is never interpreted as SQL.'},
  {q:'What happens if you set box.innerHTML = userInput without escaping it?', opts:['Nothing, innerHTML is always safe','If userInput contains <script>, the browser may execute that code — this is XSS','The page will stop loading','This only happens in Internet Explorer'], correct:1, exp:'innerHTML interprets the string as HTML — including script tags, onerror handlers, and the like.'},
  {q:'How does textContent instead of innerHTML help against XSS?', opts:['It inserts data as plain text rather than markup, so tags don\'t execute','It runs faster','It automatically saves data to a database','It only supports English text'], correct:0, exp:'textContent never interprets its content as markup — this reliably neutralizes HTML/JS injection at that point.'}
 ] },
a06:{ t:'A06 · Insecure Design', short:'Insecure Design', tag:'Design',
 theory:[
 'This category is about architectural mistakes, not implementation bugs: even perfectly written code can be insecure if the application logic itself was designed without considering threats.',
 'A classic example is trusting data from the client where the decision should be made by the server. If an item\'s price is sent in the checkout request body and the server just uses it — no matter how carefully the rest of the code is written, the logic is already broken.',
 'Other examples of insecure design: no rate limiting on sensitive operations (passwords or promo codes can be brute-forced without limit), business logic that doesn\'t account for abuse (e.g. allowing a negative item quantity), and no threat modeling done during the design phase.',
 'This isn\'t fixed by a patch, but by rethinking the logic: the server must be the single source of truth for anything that affects money, access rights, and limits.'
 ],
 find:['Check whether editing the request body directly lets you change price/quantity/discount.','Check whether there\'s a limit on attempts (login, promo code, password reset).','Think about extreme values: negative quantity, a very large number, an empty string.','Study the whole business process — is there a step where reordering requests lets you skip a check?'],
 fix:['Recalculate on the server everything that affects money and permissions — never trust values from the client.','Add rate limiting to sensitive operations (login, password reset, promo codes).','Design with "what if the user sends something unexpected" in mind — including a malicious user.','Do threat modeling before writing code for critical features.'],
 quiz:[
  {q:'What\'s the difference between "insecure design" and "injection"?', opts:['They\'re the same thing','Injection is an implementation bug (how the code is written); insecure design is a flaw in the logic/architecture itself, even if the code is written carefully','Insecure design only refers to UI design','Injection is always more serious'], correct:1, exp:'Insecure design is a problem at the level of decisions about "how this should work," not a coding typo.'},
  {q:'Why is accepting an item\'s price from the client\'s request body an example of insecure design?', opts:['It\'s just inconvenient for the frontend','The server must be the source of truth for the price — otherwise the user can submit any number','JSON doesn\'t support floating-point numbers','It\'s purely a performance concern'], correct:1, exp:'If a critical value comes from the client and the server doesn\'t recompute it, the logic is already broken regardless of code quality.'},
  {q:'Why does a login form need rate limiting?', opts:['To make the site run faster','To make automated password guessing harder','To reduce database size','It\'s an HTTPS requirement'], correct:1, exp:'Without a limit on attempts, a password can be guessed indefinitely and quickly.'},
  {q:'What is threat modeling?', opts:['Performance testing a website','A deliberate, upfront analysis of who might attack the system, how, and what the architecture needs to account for','Designing a logo for an application','Automatically scanning code for bugs'], correct:1, exp:'Threat modeling is a design step, not a scanning tool — it addresses architectural issues, not just line-level ones.'}
 ] },
a07:{ t:'A07 · Authentication Failures', short:'Authentication Failures', tag:'Authentication',
 theory:[
 'Authentication is the process of confirming "who you are." Failures here let an attacker impersonate another user: guessing a password, stealing a session, bypassing identity verification.',
 'Common problems: no limit on the number of login attempts (passwords can be brute-forced), weak password requirements, session identifiers not rotated after login (session fixation), sessions that never expire or aren\'t reasonably tied to device/IP, bugs in "forgot password" or multi-factor authentication flows.',
 'Comparing passwords with == without timing-attack protection also belongs here — response time can indirectly reveal how many characters of a password were guessed correctly.'
 ],
 find:['Check whether you can enter an incorrect password repeatedly with no lockout or delay.','Check whether the session cookie/ID changes after a successful login.','Check the password policy — is "123456" accepted?','Check the password reset form — does it reveal whether an account exists for that email?'],
 fix:['Limit login attempts (rate limiting, a temporary lockout after N failures).','Always create a fresh session after a successful login (session.clear() + a new ID).','Require a minimum password strength and check it against known breach databases.','Use multi-factor authentication for sensitive actions.'],
 quiz:[
  {q:'What happens if a site doesn\'t limit the number of login attempts?', opts:['Nothing, it isn\'t a security issue','An attacker can brute-force passwords automatically, unhindered','The site runs faster','It only increases CSS load'], correct:1, exp:'Without an attempt limit, guessing a password becomes purely a matter of time and computing power.'},
  {q:'What is session fixation?', opts:['A user forgot their password','The session ID doesn\'t change after login, letting an attacker plant a known session ID on the victim beforehand','A session expires too quickly','Cookies don\'t work in a mobile browser'], correct:1, exp:'If the server doesn\'t issue a new session ID after login, a pre-known ID can be used to hijack the victim\'s session.'},
  {q:'Why shouldn\'t a "forgot password" form reveal whether an email exists in the database?', opts:['It\'s a default GDPR requirement','Otherwise an attacker can build a list of existing accounts (username enumeration)','So the site loads faster','It has nothing to do with security'], correct:1, exp:'Different responses for "email found" / "email not found" let an attacker enumerate real users.'},
  {q:'What should happen right after a user logs in successfully?', opts:['Nothing special','A new session should be created (fresh ID), rather than reusing the old one','Logging should be disabled','TLS level should be lowered for speed'], correct:1, exp:'A fresh session after login closes off attacks like session fixation.'}
 ] },
a08:{ t:'A08 · Software or Data Integrity Failures', short:'Software or Data Integrity Failures', tag:'Integrity',
 theory:[
 'This category covers what happens when an application trusts data or code whose integrity nobody verified. The classic example is insecure deserialization: the server turns a byte stream — often supplied by the user, e.g. in a cookie — back into program objects, and if the format can encode "instructions" rather than just data, an attacker can achieve arbitrary code execution.',
 'Example — Python\'s pickle: it can serialize almost any object, including function calls. If an application runs pickle.loads() on data taken from a cookie, a specially crafted byte sequence will make the server execute the attacker\'s code during deserialization.',
 'This also covers auto-updates applied without checking a digital signature, and CI/CD pipelines that trust unverified artifacts — in other words, "trust without verifying origin" in any form.'
 ],
 find:['Check whether the application uses serialized objects (pickle, PHP serialize, Java objects) in cookies or parameters.','Check whether a signature/checksum is verified before an update or build artifact is applied.','Try tampering with serialized data in a cookie and observe the server\'s response.'],
 fix:['Don\'t deserialize untrusted data into "dangerous" formats (pickle, PHP unserialize) — use safe data-only formats (JSON) with no executable constructs.','Sign important data (HMAC) and verify the signature before using it.','Verify digital signatures for updates and build artifacts before applying them.'],
 quiz:[
  {q:'What\'s the main danger of running pickle.loads() on data from a user\'s cookie?', opts:['It\'s just slow','The pickle format can encode not just data but object calls — an attacker may achieve execution of their own code','Cookies are limited to 4 KB','Pickle only works with numbers'], correct:1, exp:'Insecure deserialization is one of the most dangerous vulnerability classes — ranging from data disclosure to RCE (remote code execution).'},
  {q:'How does an HMAC signature help defend against tampered serialized data?', opts:['It compresses the data','It lets the server verify data hasn\'t been altered since it was signed — tampering will be detected','It speeds up deserialization','It replaces the need for HTTPS'], correct:1, exp:'If the signature doesn\'t match, the server rejects the data before deserializing it.'},
  {q:'Why is JSON generally safer than pickle for data sent from the client?', opts:['JSON parses faster','JSON is a data-only format — it can\'t encode a "function call" or an arbitrary object','JSON doesn\'t support nested objects','It isn\'t — both are equally dangerous'], correct:1, exp:'JSON only describes data structures (numbers, strings, lists, objects) — it has no mechanism to "execute code."'},
  {q:'Which of these is an example of a software integrity failure?', opts:['No HTTPS','An auto-updater that installs a package without checking the publisher\'s digital signature','A very long password','Directory listing enabled'], correct:1, exp:'If an update isn\'t verified by signature, a tampered malicious package can be installed as if it were "official."'}
 ] },
a09:{ t:'A09 · Logging & Alerting Failures', short:'Logging & Alerting Failures', tag:'Monitoring',
 theory:[
 'This category isn\'t about how an attacker gets in — it\'s about whether anyone notices. If an application doesn\'t log failed login attempts, permission changes, or suspicious requests, an attack can continue unnoticed for months.',
 'The flip side is over-logging: if passwords, session tokens, or card numbers end up in the log, the log itself becomes a valuable target and a source of leaks. Good logging records the event ("a login attempt for user X from IP Y failed") but never the secret itself.',
 'Logs without alerts are also useless — if 500 failed login attempts in a minute notify no one, the incident can only be found after the fact, by reviewing logs once damage has already been done.'
 ],
 find:['Check whether failed login attempts are logged, and in how much detail.','Search the source code/logs for passwords or tokens stored in plaintext.','Check whether automated alerts fire on a spike in suspicious activity.'],
 fix:['Log security events: logins/logouts, permission changes, rejected requests — without secrets in plaintext.','Set up alerts for anomalies (e.g. many failed logins from one IP).','Centralize and protect logs — they are sensitive data in their own right.'],
 quiz:[
  {q:'Why is writing a user\'s password to a log a bad practice, even if the log is "only for debugging"?', opts:['It isn\'t an issue unless the log is published','The log becomes yet another place where a secret is stored in plaintext — a log leak becomes a password leak','It slows down writing logs','Logs are automatically encrypted'], correct:1, exp:'Logs are often less protected than the primary database and kept longer — secrets in them raise the risk.'},
  {q:'What happens if an application doesn\'t log failed login attempts?', opts:['Nothing critical','Password brute-forcing can go unnoticed for as long as the attacker wants','The site runs faster','GDPR forbids this kind of logging'], correct:1, exp:'Without logs and alerts, the security team has no signal that an attack is happening.'},
  {q:'Why do you need alerts, not just the logs themselves?', opts:['Alerts aren\'t needed if logs are kept','Logs without monitoring are only discovered after an incident — an alert gives a chance to react in real time','Alerts replace the need for logging','Alerts are only useful for marketing'], correct:1, exp:'A passive log nobody reads in real time is often equivalent to no logging at all.'},
  {q:'Which of these is a good example of a security log entry?', opts:['login_failed user=admin ip=203.0.113.5','login attempt password=Sup3rSecret!','GET /api/session token=eyJhbGciOi...','User-Agent: Mozilla/5.0 (a full header dump for no reason)'], correct:0, exp:'A useful entry describes the event and its context (who, from where) without containing the secret itself.'}
 ] },
a10:{ t:'A10 · Mishandling of Exceptional Conditions', short:'Mishandling of Exceptional Conditions', tag:'Errors',
 theory:[
 'This is a new category for 2025: it covers what happens when something goes wrong — a service is unavailable, a check throws an exception, input isn\'t what was expected. A well-designed system should fail safely (fail closed) rather than opening access by default (fail open).',
 'A classic example from software development is a permission check wrapped in a try/catch, where the catch block mistakenly returns true ("allow") instead of false, "just in case, so as not to break things for the user." If the permission-checking service is temporarily unavailable, this opens access to everyone.',
 'This also covers unhandled exceptions that leak data (a stack trace with infrastructure details in the response), a single unhandled error crashing an entire service, or business logic being bypassed through unusual input nobody anticipated.'
 ],
 find:['Find places where permission/signature checks are wrapped in try/catch — what gets returned on error?','Send deliberately "broken" data to the server (empty body, wrong type, very long string) — how does the service react?','Check behavior when a dependent service (database, external API) is unavailable — does the service fail closed, or does it open access?'],
 fix:['Design error handling around fail closed — on failure, access is denied by default.','Log exceptions, but never show internal details to the user.','Write tests specifically for "bad" and unexpected inputs, not just the happy path.','Verify that one component being temporarily unavailable doesn\'t open access everywhere.'],
 quiz:[
  {q:'What does "fail closed" mean in the context of security error handling?', opts:['On a check failure, access is granted by default','On a check failure, access is denied by default — the system "closes," rather than opening','The service stops completely on any error','It\'s the same as fail open'], correct:1, exp:'Fail closed means: if a check couldn\'t be performed, it\'s safer to deny access than to allow it.'},
  {q:'Why is catch (e) { return true; } in a permission-check function dangerous?', opts:['It\'s a syntax error','On any check failure (e.g. a service being unavailable), the function "just in case" grants access to everyone','It slows down the function','TypeScript wouldn\'t allow writing this'], correct:1, exp:'This is a textbook fail-open example — an error somewhere else turns into a hole in access control.'},
  {q:'Why test an application against deliberately "bad" input?', opts:['It isn\'t necessary if code passes normal tests','To see whether an unhandled exception leaks data or lets logic be bypassed','To boost test coverage for reporting purposes','It\'s only required for mobile apps'], correct:1, exp:'It\'s precisely with unusual/unexpected input that exception-handling bugs tend to surface.'},
  {q:'Which of these is the correct response to an external signature-checking service being unavailable?', opts:['Skip the check and continue as usual','Reject the operation until the service is back (fail closed)','Turn off logging to avoid filling up disk space','Automatically elevate the user\'s privileges'], correct:1, exp:'If a critical check can\'t run, it\'s safer to deny temporarily than to allow everything through.'}
 ] }
},
tools:{
 burp:{ blurb:'A GUI intercepting proxy: all browser traffic passes through it, so you can view and modify every request before it reaches the server.', guiNote:'This is a desktop GUI application — it can\'t run inside the browser terminal on this site. Install Burp locally and practice against a deliberately vulnerable target (e.g. OWASP Juice Shop or DVWA), not someone else\'s live site.', steps:['Install and launch Burp Suite Community.','Configure your browser to use the 127.0.0.1:8080 proxy (or just open Burp\'s built-in Chromium browser — it\'s already configured).','Install Burp\'s certificate in your browser (Proxy → CA Certificate) to see HTTPS traffic without warnings.','On the Target tab, add the domain you\'re testing to Scope so the history doesn\'t fill up with unrelated traffic.','Turn on Proxy → Intercept is on — every request now pauses so you can edit it before it\'s sent.','Find the request you care about in Proxy → HTTP history and send it to Repeater (Ctrl+R).','In Repeater, tweak parameters by hand and resend, comparing responses — handy for checking IDOR and logic flaws.','For automated value testing, use Intruder: mark the payload position and attach a wordlist (e.g. a list of user IDs).','The Target → Site map tab gradually builds a map of everything you\'ve explored.'] },
 zap:{ blurb:'OWASP\'s free scanner and proxy — automatically checks for common vulnerabilities and lets you explore a site manually, similar to Burp.', guiNote:'Also a desktop GUI app — it won\'t run in the browser terminal. Install ZAP locally and practice on deliberately vulnerable targets.', steps:['Install OWASP ZAP.','On the start screen, enter the site address in the "URL to Attack" field.','Run an Automated Scan — it crawls links itself (spider) and scans what it finds (active scan).','Review the Alerts tab — findings are grouped by severity (High/Medium/Low/Info).','For manual exploration, point your browser at ZAP\'s proxy (usually 127.0.0.1:8080) or enable the HUD — then traffic is visible live, like in Burp.','The History tab lists every intercepted request in order — handy for finding a specific one.','Run Spider on its own first to map the site, then manually choose what to scan.','Active Scan can be run against a single node in the site tree instead of the whole site.'] },
 nmap:{ blurb:'A network and port scanner — shows which services are running on a host and their versions.', steps:['Install nmap.','Run a basic scan against a host.','Add -sV to detect service versions.','Review the list of open ports and services.'] },
 whatweb:{ blurb:'Identifies a site\'s technologies: CMS, framework, server, versions — quick reconnaissance before deeper testing.', steps:['Install whatweb.','Scan the target address.','Review the output: CMS, server, JS libraries.'] },
 ffuf:{ blurb:'A fast path/parameter brute-forcer — substitutes wordlist entries in place of FUZZ and shows which addresses actually exist.', steps:['Install ffuf.','Prepare a wordlist of paths.','Run directory brute-forcing with a FUZZ marker in the URL.','Filter interesting findings by response code (-mc 200,301).'] },
 nikto:{ blurb:'An automated web server scanner — checks thousands of known problematic files, configurations, and outdated software.', steps:['Install nikto.','Scan the target host.','Review the report of findings.'] },
 curl:{ blurb:'A command-line HTTP tool — the backbone of manual testing: headers, response bodies, any method and parameters.', steps:['Request the response headers.','Request a specific page in full.','Try altering request parameters and observe the server\'s response.'] },
 sqlmap:{ blurb:'Automates finding and exploiting SQL injection — sends dozens of payload types to a parameter and analyzes the differences in responses.', steps:['Install sqlmap.','Point it at a vulnerable URL with -u.','Run a basic scan with --batch (auto-answers prompts).','If injection is found, enumerate databases with --dbs.'] },
 testssl:{ blurb:'Checks a site\'s TLS/SSL configuration: supported protocols, ciphers, certificate, and known TLS vulnerabilities.', steps:['Download testssl.sh.','Scan the target domain.','Review the report: outdated protocols, weak ciphers, certificate issues.'] },
 trivy:{ blurb:'A vulnerability scanner for dependencies, containers, and filesystems — finds known CVEs in the libraries you use.', steps:['Install trivy.','Scan the project filesystem.','Review the list of found vulnerabilities by severity.'] }
},

}

function normCmd(s){
  return s.trim().toLowerCase().replace(/\s+/g,' ').replace(/[\u2018\u2019\u201c\u201d]/g,'"').replace(/'/g,'"');
}
const LAB_CMD_INDEX = {};
Object.keys(LAB_DEFS).forEach(id=>{
  LAB_DEFS[id].steps.forEach((step, i)=>{
    LAB_CMD_INDEX[normCmd(step.cmd)] = { id, i, out: step.out };
  });
});
function labLookup(raw){
  const hit = LAB_CMD_INDEX[normCmd(raw)];
  if(!hit) return null;
  return hit;
}

a02:{ scenario:'В DemoShop недавно выкатили тестовый раздел. Найдите случайно оставленный открытым служебный файл с секретами.', steps:[ 'Получите заголовки ответа сервера.', 'Проверьте robots.txt — иногда он сам подсказывает, что «спрятано».', 'Загляните в путь, на который указал robots.txt.' ], success:'robots.txt должен запрещать индексацию, а не служить защитой — путь всё равно был доступен напрямую и раскрыл пароль от базы.', hints:['Заголовки ответа можно получить, добавив к curl флаг, который показывает их без тела страницы.', 'Стандартный путь для этого файла — просто /robots.txt в корне сайта.', 'robots.txt запрещал индексацию одного конкретного каталога — загляните прямо в него, а не в подкаталоги. Внутри часто оставляют файл конфигурации с переменными окружения.'] },
a03:{ scenario:'Сканер зависимостей DemoShop нашёл кое-что подозрительное в истории сборки. Разберитесь, что именно туда попало — и работает ли это до сих пор.', steps:[ 'Просканируйте зависимости проекта.', 'Посмотрите на подозрительный коммит, о котором сообщил сканер.', 'Проверьте, остался ли этот код в текущем конфиге пайплайна.' ], success:'Один незамеченный коммит в цепочке сборки — и каждый деплой скачивает и выполняет код с чужого сервера, причём это не разовый случай, а часть текущего пайплайна.', hints:['Инструмент trivy умеет сканировать файловую систему проекта: обычно это `trivy fs <каталог>` — попробуйте текущий каталог приложения (app).', 'Вывод предыдущего шага содержит короткий хэш коммита — посмотрите его содержимое через `git show <хэш>`.', 'Локальный файл конфигурации пайплайна можно прочитать напрямую — попробуйте cat с его именем (pipeline.yml).'] },
a04:{ scenario:'Проверьте, насколько надёжно защищён DemoShop криптографически, и найдите забытый отладочный путь.', steps:[ 'Определите версии сервисов на сервере.', 'Проверьте конфигурацию TLS сайта.', 'Запросите путь, на который указал предыдущий вывод.' ], success:'Отладочный эндпоинт раскрыл единый зашитый в код секретный ключ — с ним можно подделать любой токен.', hints:['Для определения версий сервисов на портах есть nmap с флагами -sV -sC.', 'Для проверки TLS-конфигурации есть специальный инструмент — testssl.sh, ему нужно только имя хоста.', 'Вывод предыдущего шага упомянул конкретный нестандартный путь — запросите его напрямую через curl.'] },
a05:{ scenario:'На странице товара DemoShop есть параметр id. Пройдите полную цепочку sqlmap: подтвердите инъекцию → список баз → список таблиц → извлеките данные.', steps:[ 'Проверьте параметр id одинарной кавычкой вручную.', 'Подтвердите инъекцию автоматически и получите список баз данных.', 'Получите список таблиц в базе demoshop.', 'Извлеките содержимое таблицы secrets.' ], success:'Вы прошли типичный рабочий процесс пентестера при SQL-инъекции — от первого симптома до извлечения данных.', hints:['Добавьте символ одинарной кавычки (\') в конец значения параметра id в URL товара и посмотрите на ответ сервера.', 'У sqlmap есть флаг, который сразу перечисляет базы данных — --dbs. Не забудьте -u с адресом и --batch, чтобы не отвечать на вопросы вручную.', 'Флаг -D указывает конкретную базу данных, а --tables запрашивает список таблиц внутри неё.', 'Флаг -T указывает конкретную таблицу, а --dump извлекает её содержимое.'] },

a08:{ scenario:'Корзина DemoShop восстанавливается из параметра state. Проверьте, как сервер обрабатывает такие данные — и что реально можно выполнить.', steps:[ 'Посмотрите документацию по этому эндпоинту.', 'Отправьте специально собранный payload вместо обычного состояния корзины.', 'Проверьте, можно ли этим способом выполнить настоящую команду на сервере.' ], success:'Сервер десериализовал недоверенные данные напрямую — вплоть до выполнения произвольной команды на сервере (RCE).', hints:['У функции восстановления состояния обычно есть отладочный или справочный путь рядом с основным — например, .../debug.', 'Параметр называется state и передаётся прямо в URL — подставьте туда любую нестандартную строку вместо настоящего base64-состояния корзины.', 'Попробуйте передать в state что-то похожее на настоящую команду ОС, например id.'] },
