<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>WebSec Start</title>
<meta name="description" content="WebSec Start — практический курс по веб-пентесту для начинающих: OWASP Top 10, CTF-лаборатории и учебный терминал (RU / UZ / EN).">
<meta name="theme-color" content="#0D1013">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230D1013'/%3E%3Cpath d='M7 10l7 6-7 6' fill='none' stroke='%234FC3D9' stroke-width='3' stroke-linecap='square'/%3E%3Cpath d='M16 23h9' stroke='%234FC3D9' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --bg:#0D1013;--panel:#14171B;--ink:#D8DEE4;--muted:#6B7480;--line:#262B31;--soft:#181C21;
  --mark:#4FC3D9;--mark-ink:#04191D;
  --bad:#E5534B;--bad-bg:#241413;--good:#5FD68A;--good-bg:#0F211A;--warn:#D7A72F;--warn-bg:#241D0E;
  --code-bg:#07090B;--code-ink:#D8DEE4;--code-dim:#5C6470;
  --t-amber:#D7A72F;--t-red:#E5534B;--t-green:#5FD68A;--t-blue:#5B9DF9;
  --cat0:#E5534B;--cat1:#D7A72F;--cat2:#C678DD;--cat3:#5FD68A;--cat4:#5B9DF9;
  --font-body:'Onest',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-head:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --font-mono:'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --hdr:76px;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg:#EEF0F1;--panel:#FFFFFF;--ink:#171A1D;--muted:#5B6570;--line:#D6DADD;--soft:#E6E9EB;
    --mark:#0E7A8C;--mark-ink:#F4FEFF;
    --bad:#B8332B;--bad-bg:#FBECEA;--good:#1B7A4D;--good-bg:#E7F5ED;--warn:#8A6300;--warn-bg:#FFF3D6;
    --code-bg:#11151A;--code-ink:#DCE6EE;--code-dim:#7C8896;
    --cat0:#B8332B;--cat1:#8A6300;--cat2:#7A3FBD;--cat3:#0E7A55;--cat4:#1D5FA5;
  }
}
:root[data-theme="light"]{
  --bg:#EEF0F1;--panel:#FFFFFF;--ink:#171A1D;--muted:#5B6570;--line:#D6DADD;--soft:#E6E9EB;
  --mark:#0E7A8C;--mark-ink:#F4FEFF;
  --bad:#B8332B;--bad-bg:#FBECEA;--good:#1B7A4D;--good-bg:#E7F5ED;--warn:#8A6300;--warn-bg:#FFF3D6;
  --code-bg:#11151A;--code-ink:#DCE6EE;--code-dim:#7C8896;
  --cat0:#B8332B;--cat1:#8A6300;--cat2:#7A3FBD;--cat3:#0E7A55;--cat4:#1D5FA5;
}
:root[data-theme="dark"]{
  --bg:#0D1013;--panel:#14171B;--ink:#D8DEE4;--muted:#6B7480;--line:#262B31;--soft:#181C21;
  --mark:#4FC3D9;--mark-ink:#04191D;
  --bad:#E5534B;--bad-bg:#241413;--good:#5FD68A;--good-bg:#0F211A;--warn:#D7A72F;--warn-bg:#241D0E;
  --code-bg:#07090B;--code-ink:#D8DEE4;--code-dim:#5C6470;
  --cat0:#E5534B;--cat1:#D7A72F;--cat2:#C678DD;--cat3:#5FD68A;--cat4:#5B9DF9;
}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--hdr) + 8px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.6}
a{color:inherit}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;box-shadow:0 0 0 5px var(--mark)}
[hidden]{display:none!important}

/* header: terminal title bar */
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--bg);border-bottom:1px solid var(--line)}
.hdr-top{height:48px;display:flex;align-items:center;gap:8px;padding:0 14px}
.hdr-dots{display:flex;gap:6px;flex:none}
.hdr-dots i{width:9px;height:9px;border-radius:50%;background:var(--line)}
.brand{font-family:var(--font-head);font-weight:700;font-size:13px;text-decoration:none;color:var(--muted);white-space:nowrap;margin-left:2px;min-width:0;overflow:hidden;text-overflow:ellipsis}
.brand b{color:var(--ink);font-weight:700}
.brand .short{display:none}
.brand .cursor{display:inline-block;width:7px;height:14px;background:var(--mark);margin-left:2px;vertical-align:-2px;animation:blink 1.1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.hdr-top .spacer{margin-left:auto}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:0;overflow:hidden;background:var(--panel);font-family:var(--font-mono)}
.seg button{border:0;background:transparent;padding:0 9px;height:32px;font-size:12px;font-weight:700;color:var(--muted);min-width:34px}
.seg button[aria-pressed="true"]{background:var(--mark);color:var(--mark-ink)}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:0;width:34px;height:34px;display:grid;place-items:center;margin-left:2px;flex:none}
.iconbtn svg{width:15px;height:15px}

/* nav: monospace command strip, same for all breakpoints */
.nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 48px);z-index:29;display:flex;overflow-x:auto;background:var(--bg);border-bottom:1px dashed var(--line);font-family:var(--font-mono);-webkit-overflow-scrolling:touch;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;display:flex;align-items:center;gap:6px;padding:9px 14px;font-size:13px;font-weight:600;color:var(--muted);text-decoration:none;border-right:1px dashed var(--line);white-space:nowrap}
.nav a svg{width:14px;height:14px}
.nav a .k{color:var(--code-dim);font-weight:700}
.nav a[aria-current="page"]{color:var(--mark-ink);background:var(--mark)}
.nav a[aria-current="page"] .k{color:var(--mark-ink);opacity:.7}

main{display:block;padding:22px 16px 60px;max-width:860px;margin:0 auto}
@media (min-width:900px){
  main{padding:36px 40px 60px}
  main>.page{max-width:820px}
}

/* type */
h1,h2,h3{font-family:var(--font-head);font-weight:700;letter-spacing:-.01em;margin:0}
h1{font-size:clamp(20px,5vw,28px);line-height:1.3}
h1::before{content:"# ";color:var(--mark)}
h2{font-size:14px;line-height:1.3;font-weight:700;margin-top:36px;margin-bottom:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
h2::before{content:"## ";color:var(--code-dim)}
h3{font-size:14px;font-weight:700;font-family:var(--font-mono)}
p{margin:0 0 12px;max-width:68ch}
.lede{font-size:16px;color:var(--muted);margin-top:12px;max-width:58ch}
.cmdline{font-family:var(--font-mono);font-size:13px;color:var(--code-dim);margin:0 0 14px}
.cmdline .ps2{color:var(--mark);margin-right:6px}
.muted{color:var(--muted)}
code,.mono{font-family:var(--font-mono);font-size:.88em}
p code,li code,dd code{background:var(--soft);padding:1px 5px;border-radius:4px}

/* buttons: bracketed terminal-style commands */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:transparent;color:var(--ink);padding:11px 4px;font-family:var(--font-mono);font-weight:700;text-decoration:none;min-height:44px;white-space:nowrap}
.btn::before{content:"[ ";color:var(--code-dim);font-weight:400}
.btn::after{content:" ]";color:var(--code-dim);font-weight:400}
.btn:hover{color:var(--mark)}
.btn.mark{color:var(--mark)}
.btn.alt{color:var(--ink)}
.btn.sm{padding:4px 2px;min-height:34px;font-size:13px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.actions{display:flex;flex-wrap:wrap;gap:6px 18px;margin-top:20px;align-items:center}

/* rules note: compiler-warning style */
.rules{margin-top:24px;padding:12px 14px;background:var(--warn-bg);border:1px dashed var(--warn);font-family:var(--font-mono);font-size:13px}
.rules b{display:block;margin-bottom:4px;color:var(--warn);text-transform:uppercase;letter-spacing:.04em;font-size:12px}
.rules b::before{content:"⚠ "}
.rules p{margin:0;color:var(--ink);font-family:var(--font-body);font-size:14.5px}

/* register: directory-listing style */
.reg{margin-top:28px;background:var(--panel);border:1px solid var(--line)}
.reg-h{display:flex;justify-content:space-between;align-items:baseline;padding:10px 16px;border-bottom:1px dashed var(--line);font-family:var(--font-mono);font-size:12px;color:var(--code-dim)}
.reg-h h2{margin:0;text-transform:none;letter-spacing:0;font-size:13px}
.reg-h h2::before{content:""}
.row{display:grid;grid-template-columns:46px 1fr auto;gap:12px;align-items:center;padding:12px 16px;text-decoration:none;border-bottom:1px dashed var(--line);border-left:3px solid var(--row-accent,var(--line))}
.row:last-child{border-bottom:0}
.row:hover{background:var(--soft)}
.row .code{font-family:var(--font-mono);font-weight:700;font-size:14px;color:var(--row-accent,var(--ink))}
.row .ti{display:block;font-weight:700;line-height:1.3}
.row .su{display:block;color:var(--muted);font-size:13.5px;line-height:1.35;margin-top:2px;font-family:var(--font-mono)}
.st{font-family:var(--font-mono);font-size:12px;font-weight:700;white-space:nowrap;color:var(--muted)}
.st.read{color:var(--warn)}
.st.pass{color:var(--good)}
@media (max-width:520px){.row{grid-template-columns:40px 1fr}.row .st{grid-column:2;justify-self:start;margin-top:2px}}

/* lesson */
.crumb{display:inline-flex;gap:6px;align-items:center;color:var(--muted);text-decoration:none;font-size:14px;margin-bottom:14px}
.tag{display:inline-block;font-family:var(--font-mono);font-weight:700;font-size:13px;background:var(--row-accent,var(--mark));color:var(--bg);padding:2px 8px;border-radius:5px;margin-bottom:10px}
.tabs{display:flex;gap:4px;margin-top:22px;border-bottom:1px solid var(--line)}
.tabs a{padding:10px 16px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:3px solid transparent;margin-bottom:-1px}
.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--mark)}
.defs{margin:0;display:grid;gap:10px}
.defs>div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.defs dt{font-weight:700;margin-bottom:2px}
.defs dd{margin:0;color:var(--muted);font-size:15px}
.code-pair{display:grid;gap:12px}
.blk{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--code-bg)}
.blk-h{display:flex;justify-content:space-between;font-size:13px;font-weight:700;padding:7px 12px;border-bottom:1px solid rgba(255,255,255,.08)}
.blk.bad .blk-h{background:var(--bad-bg);color:var(--bad)}
.blk.good .blk-h{background:var(--good-bg);color:var(--good)}
pre{margin:0;padding:12px 14px;overflow-x:auto;font-family:var(--font-mono);font-size:13px;line-height:1.55;color:var(--code-ink);tab-size:2}
@media (min-width:1100px){.code-pair{grid-template-columns:1fr 1fr}}
.checks{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.checks li{position:relative;padding-left:28px;max-width:68ch}
.checks li::before{content:"";position:absolute;left:0;top:.35em;width:16px;height:16px;border:2px solid var(--ink);border-radius:4px}
.fixes li::before{background:var(--good);border-color:var(--good);clip-path:none}
.chips{display:flex;flex-wrap:wrap;gap:6px 16px}
.chip{display:inline-flex;gap:4px;align-items:center;padding:0;border:0;text-decoration:none;font-weight:700;font-size:13px;font-family:var(--font-mono);background:transparent;color:var(--ink)}
.chip::before{content:"[ ";color:var(--code-dim);font-weight:400}
.chip::after{content:" ]";color:var(--code-dim);font-weight:400}
.chip:hover{color:var(--mark)}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:36px;padding-top:16px;border-top:1px solid var(--line)}

/* quiz */
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:22px 0 8px}
.bar{height:6px;background:var(--soft);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:999px}
.q{font-size:19px;font-weight:600;line-height:1.4;margin:18px 0 16px;max-width:60ch}
.opts{display:grid;gap:10px}
.opt{display:block;width:100%;text-align:left;padding:14px 16px;background:var(--panel);border:1.5px solid var(--line);border-radius:10px;font-size:16px;line-height:1.4;min-height:52px}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt.right{border-color:var(--good);background:var(--good-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.opt:disabled{cursor:default}
.opt.dim{opacity:.6}
.fb{margin-top:14px;padding:12px 14px;border-radius:10px;font-size:15px}
.fb.ok{background:var(--good-bg);color:var(--good)}
.fb.no{background:var(--bad-bg);color:var(--bad)}
.fb b{display:block}
.fb span{color:var(--ink)}
.result{margin-top:24px;padding:22px;background:var(--panel);border:1px solid var(--line);border-radius:12px}
.score{font-family:var(--font-head);font-weight:600;font-size:44px;line-height:1}

/* tools */
.list{margin-top:24px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.trow{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:14px 16px;text-decoration:none;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow:hover{background:var(--soft)}
.trow .ti{font-weight:700}
.trow .su{grid-column:1/-1;color:var(--muted);font-size:14px;line-height:1.4}
.kind{font-family:var(--font-mono);font-size:12px;font-weight:700;border:1px solid var(--line);border-radius:5px;padding:1px 7px;color:var(--muted)}
.ex{margin-top:14px;display:grid;gap:6px}
.ex .cmdline{display:flex;gap:8px;align-items:stretch}
.ex .cmdline pre{flex:1;border-radius:8px;background:var(--code-bg)}
.ex .note{font-size:15px;color:var(--muted);margin:0 0 10px}
.steps{margin:0;padding-left:22px;display:grid;gap:8px}
.steps li{max-width:66ch}
.kv{display:grid;gap:12px;margin-top:20px}
.kv>div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.kv b{display:block;font-size:14px;color:var(--muted);font-weight:600;margin-bottom:2px}

/* terminal */
.term{margin-top:18px;background:var(--code-bg);border:1px solid var(--line);border-radius:12px;overflow:hidden;color:var(--code-ink)}
.term-bar{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.08);font-family:var(--font-mono);font-size:12px;color:var(--code-dim)}
.term-bar i{width:9px;height:9px;border-radius:50%;background:#33475A;display:inline-block}
.term-bar span{margin-left:6px}
.term-out{height:min(58vh,520px);overflow:auto;padding:12px 14px;font-family:var(--font-mono);font-size:13px;line-height:1.5;-webkit-overflow-scrolling:touch}
.term-out div{white-space:pre-wrap;word-break:break-word;min-height:1.5em}
.tl-dim{color:var(--code-dim)}.tl-amber{color:var(--t-amber)}.tl-red{color:var(--t-red)}.tl-green{color:var(--t-green)}.tl-blue{color:var(--t-blue)}.tl-cmd{color:#fff}
.term-go{flex:none;border:1px solid #2A3E50;background:#101F2D;color:var(--t-amber);font-family:var(--font-mono);font-weight:700;font-size:15px;min-width:40px;height:34px;cursor:pointer}
.term-in{display:flex;align-items:center;gap:8px;padding:8px 14px 10px;border-top:1px solid rgba(255,255,255,.08);font-family:var(--font-mono);font-size:13px}
.term-in .ps{color:var(--t-amber);white-space:nowrap}
.term-in input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font:inherit;font-size:16px;outline:0;caret-color:var(--t-amber)}
.term-in input:focus-visible{box-shadow:none}
.term-in:focus-within{box-shadow:inset 0 0 0 2px var(--t-amber)}
.quick{display:flex;gap:8px;overflow-x:auto;padding:0 14px 12px;-webkit-overflow-scrolling:touch}
.quick button{flex:none;border:1px solid #2A3E50;background:#101F2D;color:var(--code-ink);border-radius:999px;padding:6px 12px;font-family:var(--font-mono);font-size:12px}
.quick button:hover{border-color:var(--t-amber);color:var(--t-amber)}
.missions{list-style:none;margin:0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.missions li{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:start;padding:12px 14px;border-bottom:1px solid var(--line)}
.missions li:last-child{border-bottom:0}
.missions .tick{font-family:var(--font-mono);font-weight:700;color:var(--muted);font-size:15px;line-height:1.5;flex:none}
.missions .tick::before{content:"[ ]"}
.missions li.done .tick{color:var(--good)}
.missions li.done .tick::before{content:"[x]"}
.missions li.done .mt{color:var(--muted)}
.missions .mt{font-weight:600;line-height:1.35}
.missions .md{font-size:14px;color:var(--muted)}
.missions .ref{font-family:var(--font-mono);font-size:12px;font-weight:700;color:var(--muted)}

/* practical lab */
.lab-steps{list-style:none;margin:14px 0 0;padding:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.lab-steps li{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;padding:13px 14px;border-bottom:1px solid var(--line)}
.lab-steps li:last-child{border-bottom:0}
.lab-steps .tick{font-family:var(--font-mono);font-weight:700;color:var(--muted);font-size:15px;line-height:1.5;flex:none}
.lab-steps .tick::before{content:"[ ]"}
.lab-steps li.done .tick{color:var(--good)}
.lab-steps li.done .tick::before{content:"[x]"}
.lab-steps li.done .st-text{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--line)}
.st-text{font-weight:600;line-height:1.4;margin-bottom:8px}
.chip.sm{padding:5px 10px;font-size:13px;font-weight:700}
.chip.sm.tl-code{font-family:var(--font-mono);background:var(--code-bg);color:var(--code-ink);border-color:var(--code-bg)}
.hint-text{margin-top:8px;padding:9px 12px;background:var(--soft);border-left:3px solid var(--mark);border-radius:0 8px 8px 0;font-size:14px;color:var(--muted);max-width:60ch}
.flagbox{margin-top:6px;font-weight:700;letter-spacing:.02em;background:var(--code-bg);color:var(--t-green);padding:8px 12px;border-radius:8px;display:inline-block}
.lab-progress{font-size:14px;color:var(--muted);margin-top:16px}

/* auth gate */
.authwrap{min-height:calc(100vh - 82px);display:flex;align-items:center;justify-content:center;padding:20px}
.authbox{width:100%;max-width:380px}
.authbox h1{margin-top:6px}
#authForm{margin-top:22px;display:grid;gap:14px}
.fld{display:grid;gap:6px;font-family:var(--font-mono);font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.fld input{font-family:var(--font-body);font-size:16px;color:var(--ink);background:var(--panel);border:1px solid var(--line);padding:10px 12px;border-radius:0}
.fld input:focus-visible{outline:none;border-color:var(--mark)}
.authswitch{margin-top:18px;font-size:14px;color:var(--muted)}
.authswitch a{color:var(--mark);font-weight:700;text-decoration:none}
.authnote{margin-top:28px;font-size:12.5px;color:var(--code-dim);font-family:var(--font-mono);border-top:1px dashed var(--line);padding-top:12px}

/* progress */
.meters{margin-top:22px;background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.meter{padding:16px 18px;border-bottom:1px solid var(--line)}
.meter:last-child{border-bottom:0}
.meter .row-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:8px}
.meter .n{font-family:var(--font-mono);font-weight:700;font-size:20px}
.meter .l{color:var(--muted);font-size:14px}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
/* mobile */

/* server sync + scoreboard */
.sync{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none;background:var(--muted);margin:0 2px}
.sync.ok{background:var(--good)}
.sync.pending{background:var(--warn)}
.sync.error{background:var(--bad)}
.board{width:100%;border-collapse:collapse;font-family:var(--font-mono);font-size:13px}
.board th{text-align:left;color:var(--code-dim);font-weight:600;padding:10px 12px;border-bottom:1px dashed var(--line);white-space:nowrap}
.board td{padding:11px 12px;border-bottom:1px dashed var(--line);white-space:nowrap}
.board tr:last-child td{border-bottom:0}
.board .n{text-align:right}
.board tr.me td{background:var(--soft);color:var(--mark);font-weight:700}

 theory:[
 'Контроль доступа — это проверки, которые решают, что именно разрешено делать конкретному пользователю: какие страницы смотреть, чьи данные читать, какие действия выполнять. «Нарушенный контроль доступа» — это когда сервер выполняет действие или отдаёт данные, не проверив как следует, имеет ли пользователь на это право.',
 'Самый частый пример — IDOR (Insecure Direct Object Reference): в запросе есть идентификатор объекта (например, /api/orders/1001), и сервер отдаёт объект просто по ID, не проверяя, принадлежит ли он текущему пользователю. Достаточно поменять число в адресе — и вы видите чужой заказ.',

 'В 2025 году это категория №1 — она встречается почти в каждом протестированном приложении, потому что проверку прав легко забыть в одном из десятков обработчиков запросов.'

 'Типичный сценарий: разработчик оставил autoindex on на nginx — и весь каталог с бэкапами базы данных стал доступен по прямой ссылке. Или .env с паролями от базы данных оказался в корне сайта и отдаётся как обычный текстовый файл.'
 ],
 find:['Проверьте /.git/HEAD, /.env, /backup.zip, /config.php.bak — отдаются ли служебные файлы?','Загляните в заголовки ответа (curl -I) — видна ли версия сервера/фреймворка?','Попробуйте открыть каталог без index-файла — включён ли листинг?','Вызовите несуществующий адрес — не «протекает» ли стек-трейс с путями на сервере?'],
 fix:['Отключите листинг директорий и вывод версий (server_tokens off).','Уберите служебные файлы и .git из публичного каталога, запретите к ним доступ явно.','Показывайте пользователю общую страницу ошибки, детали — только в логах.','Добавьте security-заголовки: HSTS, X-Content-Type-Options, CSP.'],
 quiz:[
  {q:'Что из перечисленного — пример небезопасной конфигурации?', opts:['SQL-запрос со строковой конкатенацией','Открытый /.git/ каталог на боевом сервере','Слабый алгоритм хеширования MD5','Отсутствие проверки владельца объекта'], correct:1, exp:'Открытая папка .git — это утечка из-за конфигурации сервера, а не ошибка в бизнес-логике.'},
  {q:'Зачем отключать вывод подробного стек-трейса пользователю?', opts:['Это ускоряет сайт','Он может раскрыть пути на сервере, версии библиотек и структуру кода — подсказки для атаки','Так требует HTTP-протокол','Это не имеет значения для безопасности'], correct:1, exp:'Подробная ошибка — бесплатная разведка для атакующего.'},
  {q:'Что делает заголовок Strict-Transport-Security (HSTS)?', opts:['Шифрует пароли в базе','Заставляет браузер всегда обращаться к сайту только по HTTPS','Блокирует SQL-инъекции','Ограничивает частоту запросов'], correct:1, exp:'HSTS защищает от понижения соединения до незашифрованного HTTP.'},
  {q:'Почему листинг директорий (autoindex on) опасен?', opts:['Он показывает список файлов каталога всем посетителям, включая случайно оставленные бэкапы и конфиги','Он замедляет сервер','Он увеличивает размер HTML-страницы','Он мешает индексации поисковиками'], correct:0, exp:'Листинг превращает любую папку без index-файла в публичный файловый браузер.'}
 ] },
a03:{ t:'A03 · Сбои цепочки поставок ПО', short:'Software Supply Chain Failures', tag:'Зависимости',
 theory:[
 'Современное приложение почти целиком состоит из чужого кода: библиотек, пакетов, Docker-образов, CI/CD-скриптов. «Сбой цепочки поставок» — это когда атакующий компрометирует не ваш код напрямую, а что-то, от чего он зависит.',
 'Формы атаки разные: уязвимая версия библиотеки с известной CVE, которую никто не обновил; dependency confusion (публичный пакет с тем же именем, что внутренний, но выше версией — менеджер пакетов подтягивает вредоносный публичный); скомпрометированный CI/CD-пайплайн, который тихо встраивает бэкдор при каждой сборке.',
 'В 2025 году это новая отдельная категория — раньше говорили только про «устаревшие компоненты», теперь смотрят на весь жизненный цикл: откуда пришёл пакет, кто его подписал, воспроизводима ли сборка.'
 ],
 find:['Проверьте package.json/requirements.txt — есть ли версии "*" или "latest" вместо фиксированных?','Запустите сканер уязвимостей зависимостей (например, trivy) — есть ли известные CVE?','Посмотрите CI-конфиг — скрипты скачиваются и выполняются без проверки контрольной суммы/подписи?','Проверьте, зафиксирован ли lock-файл (package-lock.json) в репозитории.'],
 fix:['Фиксируйте точные версии зависимостей и коммитьте lock-файл.','Регулярно сканируйте зависимости и обновляйте компоненты с известными уязвимостями.','Не скачивайте и не исполняйте установочные скрипты без проверки подписи/хеша.','Используйте приватный реестр пакетов с приоритетом над публичным, чтобы исключить dependency confusion.'],
 quiz:[
  {q:'Что такое dependency confusion?', opts:['Опечатка в имени переменной','Публичный пакет с именем и версией выше, чем у внутреннего — менеджер пакетов ставит его вместо приватного','Забытый пароль от npm-аккаунта','Использование двух разных языков программирования в проекте'], correct:1, exp:'Атака построена на приоритете версий: если публичная версия «новее», многие менеджеры пакетов выберут именно её.'},
  {q:'Почему "express": "*" в package.json — плохая практика?', opts:['Так проект весит больше','Любая, в том числе вредоносная или уязвимая новая версия будет установлена автоматически','Это устаревший синтаксис JSON','Это влияет только на скорость установки'], correct:1, exp:'Незафиксированная версия убирает контроль над тем, какой именно код попадёт в сборку.'},
  {q:'Зачем коммитить lock-файл (package-lock.json) в репозиторий?', opts:['Чтобы уменьшить размер репозитория','Чтобы у всех и в CI ставились одинаковые, проверенные версии зависимостей','Это требование лицензии MIT','Чтобы ускорить работу IDE'], correct:1, exp:'Lock-файл фиксирует дерево зависимостей — сборка становится воспроизводимой и предсказуемой.'},
  {q:'Что из этого — практика для защиты CI/CD-пайплайна?', opts:['curl https://get.example.sh | bash без проверки','Скачивать установщик и сверять его контрольную сумму перед запуском','Хранить все секреты прямо в коде пайплайна','Отключить логирование сборок'], correct:1, exp:'Проверка хеша/подписи не даёт подменённому или скомпрометированному скрипту выполниться незаметно.'}
 ] },
a04:{ t:'A04 · Криптографические сбои', short:'Cryptographic Failures', tag:'Крипто',
 theory:[
 'Это про то, как данные защищены (или не защищены) при хранении и передаче: пароли, номера карт, токены сессии, персональные данные. Раньше категория называлась «утечка чувствительных данных» — сейчас фокус сместился на первопричину: слабую или отсутствующую криптографию.',
 'Частые ошибки: пароли хранятся в открытом виде или хешируются быстрым алгоритмом без соли (MD5, SHA1) — такие хеши взламываются перебором за секунды на видеокарте; сайт разрешает работать по HTTP вместо HTTPS; используются самописные или устаревшие алгоритмы шифрования; секретные ключи «зашиты» в код.',
 'Правильный подход для паролей — медленные, специально созданные для этого алгоритмы (Argon2, bcrypt, scrypt) с солью, которые намеренно требуют много времени и памяти на каждую попытку.'
 ],
 find:['Проверьте, доступен ли сайт по обычному HTTP, и есть ли редирект на HTTPS.','Инструментом вроде testssl.sh проверьте, какие версии TLS и шифры поддерживаются.','Если есть доступ к базе (в лаборатории) — посмотрите, чем хешируются пароли.','Поищите в коде/репозитории «зашитые» API-ключи и секреты.'],
 fix:['Используйте Argon2 или bcrypt для хеширования паролей — никогда не MD5/SHA1 напрямую.','Принудительно перенаправляйте весь трафик на HTTPS и включите HSTS.','Отключите устаревшие версии TLS (1.0/1.1) и слабые шифры.','Храните секреты в менеджере секретов, а не в коде.'],
 quiz:[
  {q:'Почему MD5 — плохой выбор для хеширования паролей?', opts:['Он слишком медленный','Он спроектирован быть быстрым, поэтому перебор хешей происходит очень быстро на современном железе','Он использует слишком много памяти','Он не работает с UTF-8'], correct:1, exp:'Скорость — плюс для контрольных сумм файлов, но огромный минус для паролей: перебор становится дешёвым.'},
  {q:'Что делает алгоритм вроде Argon2 более подходящим для паролей, чем MD5?', opts:['Он короче по длине хеша','Он намеренно медленный и требует много памяти, что удорожает перебор','Он не использует соль','Он быстрее MD5'], correct:1, exp:'Argon2 специально проектировался «дорогим» по времени и памяти — это и есть защита от перебора.'},
  {q:'Зачем нужен HSTS-заголовок применительно к криптографии?', opts:['Он шифрует базу данных','Он не даёт браузеру откатиться на незашифрованный HTTP даже при попытке атакующего','Он ускоряет TLS-рукопожатие','Он хеширует cookie'], correct:1, exp:'HSTS закрывает окно для атак понижения протокола до HTTP.'},
  {q:'Что из этого — пример криптографического сбоя?', opts:['Отсутствие проверки прав на объект','Секретный API-ключ, «зашитый» прямо в исходном коде репозитория','Отсутствие CAPTCHA на форме входа','Открытый листинг директорий'], correct:1, exp:'Ключ в коде рано или поздно попадёт в чужие руки — через утечку репозитория, форк, историю коммитов.'}
 ] },
a05:{ t:'A05 · Инъекции', short:'Injection', tag:'Инъекции',
 theory:[
 'Инъекция происходит, когда непроверенные данные пользователя попадают в интерпретатор — SQL, HTML/JS в браузере, команду операционной системы — и он начинает воспринимать часть этих данных как код, а не как обычное значение.',
 'SQL-инъекция: если строка запроса собирается конкатенацией ("... WHERE id = " + id), атакующий может дописать в параметр id свою часть SQL и, например, получить все строки таблицы или вообще другую таблицу целиком.',
 'XSS (Cross-Site Scripting): если введённый пользователем текст вставляется в HTML-страницу без экранирования, браузер жертвы выполнит вставленный <script>. Это позволяет красть cookie сессии, перехватывать действия пользователя, показывать поддельные формы входа.',
 'Главное лекарство от обоих — не собирать код из строк с данными пользователя: параметризованные запросы для SQL и текстовые (не HTML) вставки для вывода в браузер.'
 ],
 find:['В параметр вроде ?id=1 добавьте одинарную кавычку (\') — не появилась ли ошибка SQL-синтаксиса в ответе?','В поле поиска введите <script>alert(1)<\/script> — выполнится ли скрипт?','Попробуйте типичные полезные нагрузки sqlmap на подозрительном параметре в лаборатории.','Проверьте, экранируются ли специальные символы (< > " \') при выводе введённых данных обратно на страницу.'],
 fix:['Используйте параметризованные запросы (prepared statements) — никогда конкатенацию строк для SQL.','Экранируйте / кодируйте вывод в зависимости от контекста (HTML, атрибут, JS) или используйте textContent вместо innerHTML.','Внедрите Content-Security-Policy как дополнительный уровень защиты от XSS.','Валидируйте входные данные по принципу белого списка (разрешённый формат), а не чёрного.'],
 quiz:[
  {q:'Почему $db->query("SELECT * FROM t WHERE id = " . $_GET[\'id\']) опасно?', opts:['Запрос выполняется слишком медленно','Значение $_GET[\'id\'] становится частью SQL-кода, а не просто данными — атакующий может изменить логику запроса','PHP не поддерживает такой синтаксис','Так делать нельзя из-за лицензии MySQL'], correct:1, exp:'Конкатенация строк смешивает код и данные — классическая причина SQL-инъекций.'},
  {q:'Чем параметризованный запрос (prepared statement) отличается от конкатенации строк?', opts:['Он просто быстрее','Значения передаются отдельно от текста запроса, поэтому не могут изменить структуру SQL','Он не требует базы данных','Он автоматически шифрует данные'], correct:1, exp:'Драйвер БД чётко разделяет код запроса и данные — данные никогда не интерпретируются как SQL.'},
  {q:'Что произойдёт, если вставить box.innerHTML = userInput без экранирования?', opts:['Ничего, innerHTML всегда безопасен','Если userInput содержит <script>, браузер может выполнить этот код — это XSS','Страница перестанет открываться','Это работает только в Internet Explorer'], correct:1, exp:'innerHTML интерпретирует строку как HTML — включая теги script/onerror и подобные.'},
  {q:'Как textContent вместо innerHTML помогает против XSS?', opts:['Он вставляет данные как обычный текст, а не как HTML-разметку, поэтому теги не выполняются','Он работает быстрее','Он автоматически сохраняет данные в базу','Он поддерживает только английский текст'], correct:0, exp:'textContent никогда не интерпретирует содержимое как разметку — это надёжно нейтрализует HTML/JS-инъекцию в этом месте.'}
 ] },
a06:{ t:'A06 · Небезопасный дизайн', short:'Insecure Design', tag:'Дизайн',
 theory:[
 'Это категория про архитектурные ошибки, а не про баги в реализации: даже идеально написанный код может быть небезопасным, если сама логика приложения спроектирована без учёта угроз.',
 'Классический пример — доверие к данным, которые приходят от клиента, там, где решение должно приниматься сервером. Если цена товара передаётся в теле запроса на оформление заказа, а сервер просто её использует — не важно, насколько аккуратно написан остальной код, логика уже сломана.',
 'Другие примеры небезопасного дизайна: отсутствие ограничений частоты запросов (можно перебирать пароли или промокоды без ограничений), бизнес-логика, которая не учитывает злоупотребления (например, разрешает оформить отрицательное количество товара), отсутствие моделирования угроз на этапе проектирования.',
 'Лечится это не патчем, а пересмотром логики: сервер должен быть единственным источником истины для всего, что влияет на деньги, права доступа и лимиты.'
 ],
 find:['Проверьте, можно ли изменить цену/количество/скидку через прямое редактирование тела запроса.','Проверьте, есть ли ограничение на число попыток (логин, промокод, восстановление пароля).','Подумайте, что будет при экстремальных значениях: отрицательное количество, очень большое число, пустая строка.','Изучите бизнес-процесс целиком — есть ли шаг, где можно пропустить проверку, изменив порядок запросов?'],
 fix:['Пересчитывайте на сервере всё, что влияет на деньги и права — никогда не доверяйте значениям от клиента.','Добавляйте rate limiting на чувствительные операции (логин, восстановление пароля, промокоды).','Проектируйте с учётом «а что если пользователь пришлёт что-то неожиданное» — включая злонамеренного пользователя.','Проводите моделирование угроз (threat modeling) до написания кода для критичных функций.'],
 quiz:[
  {q:'В чём разница между «небезопасным дизайном» и «инъекцией»?', opts:['Это одно и то же','Инъекция — ошибка реализации (как написан код); небезопасный дизайн — ошибка в самой логике/архитектуре, даже если код написан аккуратно','Небезопасный дизайн относится только к дизайну интерфейса (UI)','Инъекция всегда серьёзнее'], correct:1, exp:'Небезопасный дизайн — это проблема на уровне решений «как это должно работать», а не опечатка в коде.'},
  {q:'Почему принятие цены товара из тела запроса от клиента — пример небезопасного дизайна?', opts:['Это просто неудобно для фронтенда','Сервер должен быть источником истины для цены — иначе пользователь может подставить любое число','JSON не поддерживает числа с плавающей точкой','Это связано только с производительностью'], correct:1, exp:'Если критичное значение приходит от клиента и сервер его не пересчитывает — логика уже нарушена независимо от качества кода.'},
  {q:'Зачем нужен rate limiting на форме логина?', opts:['Чтобы сайт работал быстрее','Чтобы затруднить перебор паролей автоматическими попытками','Чтобы уменьшить размер базы данных','Это требование HTTPS'], correct:1, exp:'Без ограничения числа попыток пароль можно подбирать неограниченно долго и быстро.'},
  {q:'Что такое threat modeling (моделирование угроз)?', opts:['Тестирование производительности сайта','Заранее продуманный разбор: кто может атаковать систему, как и что нужно предусмотреть в архитектуре','Дизайн логотипа для приложения','Автоматическое сканирование кода на баги'], correct:1, exp:'Threat modeling — это шаг проектирования, а не инструмент сканирования; он закрывает архитектурные, а не только «строчные» проблемы.'}
 ] },
a07:{ t:'A07 · Сбои аутентификации', short:'Authentication Failures', tag:'Аутентификация',
 theory:[
 'Аутентификация — это процесс подтверждения «кто вы». Сбои здесь дают атакующему возможность выдать себя за другого пользователя: подобрать пароль, украсть сессию, обойти проверку личности.',
 'Типичные проблемы: отсутствие ограничения на число попыток входа (можно перебирать пароли), слабые требования к паролям, идентификатор сессии не обновляется после входа (session fixation), сессия не истекает и не привязана к устройству/IP разумным образом, ошибки в реализации «забыли пароль» или многофакторной аутентификации.',
 'Сравнение паролей через == или без учёта того, что сравнение должно быть с защитой от timing-атак, тоже сюда относится — по времени ответа можно косвенно узнать, сколько символов пароля угадано верно.'
 ],
 find:['Проверьте, можно ли ввести неверный пароль много раз подряд без блокировки/задержки.','Посмотрите, меняется ли ID сессии (cookie) после успешного входа.','Проверьте политику паролей — принимается ли пароль "123456"?','Проверьте форму восстановления пароля — не раскрывает ли она, существует ли аккаунт с таким email.'],
 fix:['Ограничивайте число попыток входа (rate limiting, временная блокировка после N неудач).','Всегда создавайте новую сессию после успешного входа (session.clear() + новый ID).','Требуйте минимальную сложность пароля и проверяйте его по базам утечек.','Используйте многофакторную аутентификацию для чувствительных действий.'],
 quiz:[
  {q:'Что произойдёт, если сайт не ограничивает число попыток входа?', opts:['Ничего, это не проблема безопасности','Атакующий может перебирать пароли автоматически (brute force) без препятствий','Сайт будет работать быстрее','Это увеличивает нагрузку только на CSS'], correct:1, exp:'Без ограничения попыток подбор пароля становится вопросом времени и вычислительных ресурсов.'},
  {q:'Что такое session fixation?', opts:['Пользователь забыл пароль','ID сессии не меняется после входа, и атакующий заранее навязывает жертве известный ему ID сессии','Сессия истекает слишком быстро','Cookie не работает в мобильном браузере'], correct:1, exp:'Если сервер не выдаёт новый ID сессии после логина, заранее известный ID можно использовать для перехвата сессии жертвы.'},
  {q:'Почему форма «забыли пароль» не должна сообщать, существует ли email в базе?', opts:['Это требование GDPR по умолчанию','Иначе атакующий может составить список существующих аккаунтов (username enumeration)','Так сайт грузится быстрее','Это не имеет отношения к безопасности'], correct:1, exp:'Разные ответы для «email найден» / «email не найден» позволяют перечислить реальных пользователей.'},
  {q:'Что нужно сделать сразу после успешного входа пользователя?', opts:['Ничего особенного','Создать новую сессию (обновить ID), а не переиспользовать старую','Отключить логирование','Понизить уровень TLS для ускорения'], correct:1, exp:'Свежая сессия после логина закрывает атаки вроде session fixation.'}
 ] },
a08:{ t:'A08 · Сбои целостности ПО и данных', short:'Software or Data Integrity Failures', tag:'Целостность',
 theory:[
 'Эта категория о том, что происходит, когда приложение доверяет данным или коду, чью целостность никто не проверил. Классика — небезопасная десериализация: сервер превращает поток байт (часто присланный пользователем, например в cookie) обратно в объекты программы, и если формат позволяет закодировать не просто данные, а «инструкции», атакующий может добиться выполнения произвольного кода.',
 'Пример — Python pickle: он умеет сериализовать почти любой объект, включая вызовы функций. Если приложение делает pickle.loads() на данных из cookie, специально собранный набор байт заставит сервер выполнить код атакующего в момент десериализации.',
 'Сюда же относятся автообновления без проверки цифровой подписи и CI/CD-пайплайны, доверяющие непроверенным артефактам — то есть «доверие без проверки происхождения» в любой форме.'
 ],
 find:['Проверьте, использует ли приложение сериализованные объекты (pickle, PHP serialize, Java-объекты) в cookie или параметрах.','Проверьте, проверяется ли подпись/контрольная сумма перед применением апдейта или артефакта сборки.','Попробуйте изменить сериализованные данные в cookie и посмотреть на реакцию сервера.'],
 fix:['Не десериализуйте недоверенные данные в «опасные» форматы (pickle, PHP unserialize) — используйте безопасные форматы данных (JSON) без исполняемых конструкций.','Подписывайте важные данные (HMAC) и проверяйте подпись перед использованием.','Проверяйте цифровые подписи для апдейтов и артефактов сборки перед их применением.'],
 quiz:[
  {q:'В чём главная опасность pickle.loads() на данных из cookie пользователя?', opts:['Это просто медленно','Формат pickle может кодировать не только данные, но и вызовы объектов — атакующий может добиться выполнения своего кода','Cookie ограничены 4 КБ','Pickle работает только с числами'], correct:1, exp:'Небезопасная десериализация — один из самых опасных классов уязвимостей: от чтения данных до RCE (удалённого выполнения кода).'},
  {q:'Как HMAC-подпись помогает защититься от подделки сериализованных данных?', opts:['Она сжимает данные','Она позволяет серверу проверить, что данные не были изменены с момента подписания — подделка будет обнаружена','Она ускоряет десериализацию','Она заменяет необходимость в HTTPS'], correct:1, exp:'Если подпись не совпадает — сервер отклоняет данные ещё до десериализации.'},
  {q:'Почему JSON в целом безопаснее pickle для передачи данных от клиента?', opts:['JSON быстрее парсится','JSON — формат только для данных, он не может закодировать «вызов функции» или произвольный объект','JSON не поддерживает вложенные объекты','Это не так, оба одинаково опасны'], correct:1, exp:'JSON описывает только структуры данных (числа, строки, списки, объекты) — в нём нет механизма «выполнить код».'},
  {q:'Что из этого — пример сбоя целостности программного обеспечения?', opts:['Отсутствие HTTPS','Автообновление, которое устанавливает пакет без проверки цифровой подписи издателя','Слишком длинный пароль','Открытый листинг директорий'], correct:1, exp:'Если апдейт не проверяется по подписи, подменённый вредоносный пакет может быть установлен как «официальный».'}
 ] },
a09:{ t:'A09 · Сбои логирования и мониторинга', short:'Logging & Alerting Failures', tag:'Мониторинг',
 theory:[
 'Эта категория не про то, как атакующий проникает — а про то, замечает ли это кто-то. Если приложение не логирует неудачные попытки входа, изменения прав доступа, подозрительные запросы, — атака может продолжаться месяцами незамеченной.',
 'Вторая сторона проблемы — логирование избыточного: если в лог попадают пароли, токены сессии, номера карт, сам лог становится ценной целью и источником утечки. Хорошее логирование фиксирует событие («была неудачная попытка входа для пользователя X с IP Y»), но не секреты.',
 'Логи без алертов тоже бесполезны — если 500 неудачных попыток входа за минуту никого не уведомляют, инцидент можно найти только «постфактум», разбирая логи после того, как ущерб уже нанесён.'
 ],
 find:['Проверьте, логируются ли неудачные попытки входа и с какой детализацией.','Поищите в исходном коде/логах, не попадают ли туда пароли или токены в открытом виде.','Проверьте, есть ли автоматические оповещения при всплеске подозрительной активности.'],
 fix:['Логируйте события безопасности: вход/выход, смену прав, отклонённые запросы — без секретов в открытом виде.','Настройте алерты на аномалии (например, много неудачных попыток входа с одного IP).','Централизуйте и защищайте логи — они сами по себе чувствительные данные.'],
 quiz:[
  {q:'Почему запись пароля пользователя в лог — плохая практика, даже если лог хранится «только для отладки»?', opts:['Это не проблема, если лог не публикуется','Лог становится ещё одним местом, где хранится секрет в открытом виде — утечка лога = утечка паролей','Это замедляет запись логов','Логи автоматически шифруются'], correct:1, exp:'Логи часто менее защищены, чем основная база данных, и хранятся дольше — секреты в них повышают риск.'},
  {q:'Что произойдёт, если приложение не логирует неудачные попытки входа?', opts:['Ничего критичного','Подбор пароля (brute force) может идти незамеченным сколь угодно долго','Сайт будет работать быстрее','Это требование GDPR запрещает логирование'], correct:1, exp:'Без логов и алертов у команды безопасности нет сигнала о том, что происходит атака.'},
  {q:'Зачем нужны алерты, а не только сами логи?', opts:['Алерты не нужны, если логи ведутся','Логи без мониторинга обнаруживаются только после инцидента — алерт даёт шанс среагировать в реальном времени','Алерты заменяют необходимость логирования','Алерты нужны только для маркетинга'], correct:1, exp:'Пассивный лог, который никто не читает в реальном времени, часто равносилен отсутствию логирования.'},
  {q:'Что из перечисленного — хороший пример записи в лог безопасности?', opts:['login_failed user=admin ip=203.0.113.5','login attempt password=Sup3rSecret!','GET /api/session token=eyJhbGciOi...','User-Agent: Mozilla/5.0 (полный дамп заголовков без причины)'], correct:0, exp:'Полезная запись описывает событие и контекст (кто, откуда), но не содержит сам секрет.'}
 ] },
a10:{ t:'A10 · Неверная обработка исключительных ситуаций', short:'Mishandling of Exceptional Conditions', tag:'Ошибки',
 theory:[
 'Это новая категория 2025 года: про то, что происходит, когда что-то идёт не так — сервис недоступен, проверка бросает исключение, входные данные не такие, как ожидалось. Хорошо спроектированная система должна «падать» безопасно (fail closed), а не открывать доступ по умолчанию (fail open).',
 'Классический пример из мира разработки — проверка прав, обёрнутая в try/catch, где catch-блок по ошибке возвращает true («разрешить») вместо false, «на всякий случай, чтобы не сломать пользователю работу». Если сервис проверки прав временно недоступен, это открывает доступ всем.',
 'Сюда же относится непроверенная обработка исключений, которая приводит к утечке данных (стектрейс с деталями инфраструктуры в ответе), к падению всего сервиса из-за одной необработанной ошибки, или к обходу бизнес-логики через нестандартный ввод, который никто не предусмотрел.'
 ],
 find:['Найдите места, где проверка прав/подписи обёрнута в try/catch — что возвращается при ошибке?','Отправьте на сервер заведомо «сломанные» данные (пустое тело, неверный тип, очень длинную строку) — как реагирует сервис?','Проверьте поведение при недоступности зависимого сервиса (базы данных, внешнего API) — сервис «падает закрыто» или открывает доступ?'],
 fix:['Проектируйте обработку ошибок по принципу fail closed — при сбое доступ по умолчанию запрещён.','Логируйте исключения, но не показывайте пользователю внутренние детали.','Пишите тесты специально для «плохих» и неожиданных входных данных, а не только для «счастливого пути».','Проверяйте, что временная недоступность одного компонента не открывает доступ везде.'],
 quiz:[
  {q:'Что означает «fail closed» в контексте обработки ошибок безопасности?', opts:['При сбое проверки доступ по умолчанию разрешается','При сбое проверки доступ по умолчанию запрещается — система «закрывается», а не открывается','Сервис останавливается полностью при любой ошибке','Это то же самое, что fail open'], correct:1, exp:'Fail closed означает: если проверка не смогла выполниться, безопаснее отказать в доступе, чем разрешить его.'},
  {q:'Почему catch (e) { return true; } в функции проверки прав опасен?', opts:['Это синтаксическая ошибка','При любом сбое проверки (например, недоступности сервиса) функция «на всякий случай» разрешает доступ всем', 'Это замедляет выполнение функции','TypeScript не позволит так написать'], correct:1, exp:'Это классический пример fail open — ошибка в другом месте превращается в дыру в контроле доступа.'},
  {q:'Зачем тестировать приложение на заведомо «плохих» входных данных?', opts:['Это не нужно, если код проходит обычные тесты','Чтобы увидеть, не приводит ли необработанное исключение к утечке данных или обходу логики','Чтобы увеличить покрытие тестами для отчётности','Это требуется только для мобильных приложений'], correct:1, exp:'Именно на нестандартном/неожиданном вводе чаще всего проявляются ошибки обработки исключений.'},
  {q:'Что из этого — правильная реакция на недоступность стороннего сервиса проверки подписи?', opts:['Пропустить проверку и продолжить как обычно','Отклонить операцию до восстановления сервиса (fail closed)','Отключить логирование, чтобы не засорять диск','Автоматически повысить права пользователя'], correct:1, exp:'Если критичная проверка не может быть выполнена, безопаснее временно отказать, чем разрешить всё подряд.'}
 ] }
},
tools:{
 burp:{ blurb:'Прокси-перехватчик с графическим интерфейсом: весь трафик браузера проходит через него, вы можете смотреть и изменять каждый запрос перед отправкой на сервер.', guiNote:'Это графическое приложение — его нельзя запустить прямо в браузерном терминале на этом сайте. Установите Burp на свой компьютер и потренируйтесь на заведомо уязвимом стенде (например, OWASP Juice Shop или DVWA), а не на чужих сайтах.', steps:['Установите и запустите Burp Suite Community.','Настройте браузер на использование прокси 127.0.0.1:8080 (или откройте встроенный в Burp Chromium — он уже настроен).','Установите сертификат Burp в браузер (Proxy → CA Certificate), чтобы видеть HTTPS-трафик без предупреждений.','На вкладке Target добавьте нужный домен в Scope, чтобы не захламлять историю лишним трафиком.','Включите Proxy → Intercept is on — теперь каждый запрос будет останавливаться, и его можно отредактировать перед отправкой.','Найдите интересующий запрос в Proxy → HTTP history и отправьте его в Repeater (Ctrl+R).','В Repeater меняйте параметры вручную и заново отправляйте запрос, сравнивая ответы — удобно для проверки IDOR и логики.','Для автоматического перебора значений используйте Intruder: отметьте позицию payload и подключите список значений (например, ID пользователей).','Вкладка Target → Site map постепенно строит карту всего исследованного сайта.'] },
 zap:{ blurb:'Бесплатный сканер и прокси от OWASP — автоматически ищет типовые уязвимости и позволяет вручную исследовать сайт, как в Burp.', guiNote:'Это тоже графическое приложение — в браузерном терминале не запускается. Установите ZAP локально и тренируйтесь на специально уязвимых стендах.', steps:['Установите OWASP ZAP.','На стартовом экране введите адрес сайта в поле «URL to Attack».','Запустите Automated Scan — он сам обойдёт ссылки (spider) и просканирует найденное (active scan).','Изучите вкладку Alerts — находки сгруппированы по уровню серьёзности (High/Medium/Low/Info).','Для ручного исследования настройте браузер на прокси ZAP (обычно 127.0.0.1:8080) или включите HUD — тогда трафик виден вживую, как в Burp.','Вкладка History показывает все перехваченные запросы по порядку — удобно искать конкретный.','Spider можно запускать отдельно, чтобы сначала построить карту сайта, а потом вручную выбрать, что сканировать.','Active Scan можно запустить на одном конкретном узле дерева сайта, а не на всём сайте сразу.'] },
 nmap:{ blurb:'Сканер сети и портов — показывает, какие сервисы запущены на хосте и какой они версии.', steps:['Установите nmap.','Запустите базовое сканирование хоста.','Добавьте -sV для определения версий сервисов.','Изучите список открытых портов и служб.'] },
 whatweb:{ blurb:'Определяет технологии сайта: CMS, фреймворк, сервер, версии — быстрая разведка перед более глубоким тестированием.', steps:['Установите whatweb.','Запустите сканирование целевого адреса.','Изучите вывод: CMS, сервер, JS-библиотеки.'] },
 ffuf:{ blurb:'Быстрый брутфорсер путей и параметров — подставляет слова из словаря вместо FUZZ и показывает, какие адреса реально существуют.', steps:['Установите ffuf.','Подготовьте словарь путей.','Запустите перебор директорий с маркером FUZZ в URL.','Отфильтруйте по кодам ответа (-mc 200,301) интересные находки.'] },
 nikto:{ blurb:'Автоматический сканер веб-сервера — проверяет тысячи известных проблемных файлов, конфигураций и устаревшего ПО.', steps:['Установите nikto.','Запустите сканирование целевого хоста.','Изучите отчёт о найденных проблемах.'] },
 curl:{ blurb:'Инструмент командной строки для HTTP-запросов — основа ручного тестирования: заголовки, тело ответа, любые методы и параметры.', steps:['Запросите заголовки ответа.','Запросите конкретную страницу целиком.','Попробуйте изменить параметры запроса и посмотреть на реакцию сервера.'] },
 sqlmap:{ blurb:'Автоматизирует поиск и эксплуатацию SQL-инъекций — подставляет десятки типов полезных нагрузок в параметр и анализирует разницу в ответах.', steps:['Установите sqlmap.','Укажите уязвимый URL с параметром через -u.','Запустите базовое сканирование с --batch (автоматические ответы на вопросы).','Если найдена инъекция — перечислите базы данных с помощью --dbs.'] },
 testssl:{ blurb:'Проверяет TLS/SSL-конфигурацию сайта: поддерживаемые протоколы, шифры, сертификат, известные уязвимости TLS.', steps:['Скачайте testssl.sh.','Запустите проверку целевого домена.','Изучите отчёт: устаревшие протоколы, слабые шифры, проблемы сертификата.'] },
 trivy:{ blurb:'Сканер уязвимостей зависимостей, контейнеров и файловых систем — находит известные CVE в используемых библиотеках.', steps:['Установите trivy.','Запустите сканирование файловой системы проекта.','Изучите список найденных уязвимостей по уровню критичности.'] }
},
