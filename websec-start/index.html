a10:{ scenario:'Эндпоинт проверки токена в DemoShop падает на нестандартном вводе. Проверьте, что происходит при разных видах сбоя.', steps:[ 'Отправьте запрос вообще без значения токена.', 'Проверьте обычный, ожидаемый вызов.', 'Отправьте заведомо «сломанный» токен.' ], success:'Ошибка разбора токена не была обработана — и код «по умолчанию» пропустил пользователя вместо отказа, хотя пустой и просто неверный токен обрабатывались правильно.', hints:['Параметр token можно оставить пустым — посмотрите, как сервер реагирует на его отсутствие.', 'У эндпоинта проверки токена есть параметр token — попробуйте любое обычное значение, чтобы увидеть нормальный отказ.', 'Попробуйте вставить в значение token символ null-байта (%00) перед остальным текстом — так часто ломают простые парсеры.'] },
b01:{ title:'Бэкап → вход → чужой отчёт', scenario:'DemoShop недавно запустил закрытый портал для партнёров по адресу /partner — собирали в спешке. Проверьте, не осталось ли там лишнего и как далеко это может завести: в этой лаборатории одна находка открывает следующую.', steps:[ 'Найдите файл резервной копии, который забыли убрать с сервера.', 'Войдите в портал, используя то, что нашли в бэкапе.', 'Узнайте, к какому отчёту привязан ваш аккаунт.', 'Запросите отчёт, который вам видеть не положено.' ], success:'Один забытый файл бэкапа дал рабочий пароль, пароль — сессию, а отсутствие проверки владельца — чужой конфиденциальный отчёт. Так выглядят реальные цепочки: каждая «мелочь» открывает следующую дверь (A02 → A07 → A01).', hints:['Дампы баз данных часто оставляют в корне раздела — имя файла обычно говорит само за себя и заканчивается на .sql.', 'В дампе были логин и пароль открытым текстом. Вход в портале устроен так же, как в основном магазине, только путь начинается с /partner.', 'После входа ответ содержит идентификатор сессии — его передают в запросах параметром session. Профиль текущего пользователя обычно отдаёт эндпоинт /api/me.', 'Отчёты открываются по числовому ID — свой вы теперь знаете. Возьмите следующий по порядку и передайте ту же сессию.'] },
b02:{ title:'Хранимый XSS → кража сессии', scenario:'В карточке товара DemoShop есть отзывы покупателей, и бот-модератор открывает каждый новый. Проверьте, что будет, если отзыв не экранируется, — и во что это выльется, когда страницу откроет администратор.', steps:[ 'Оставьте отзыв к товару 205, в тексте которого вместо слов — script-тег.', 'Откройте страницу отзывов и посмотрите, что произошло, когда её открыл модератор.', 'Проверьте, что попало на сторону, куда скрипт отправлял данные.', 'Войдите в админку с тем, что удалось перехватить.' ], success:'Один неэкранированный отзыв превратился в кражу сессии администратора: при XSS страдает не тот, кто оставил payload, а тот, кто открыл страницу. Дальше достаточно подставить чужую сессию — и вы «админ».', hints:['Отзыв отправляется на /api/reviews с параметрами product и text. В text подойдёт любой script-тег — сервер сохранит его как есть.', 'Страница отзывов находится по /reviews с тем же параметром product — туда заглядывает и бот-модератор.', 'У такой атаки есть «приёмник» — путь вроде /admin/xss-log, куда стекается всё, что скрипт отправил на сервер атакующего.', 'Перехваченное — не пароль, а готовая сессия администратора; её передают параметром session на странице панели (/admin/dashboard).'] }

b01:{ title:'Zaxira nusxa → kirish → begona hisobot', scenario:'DemoShop yaqinda hamkorlar uchun /partner manzilida yopiq portal ochdi — shoshilinch yig‘ilgan. U yerda ortiqcha narsa qolmaganini tekshiring va bu qayergacha olib borishini ko‘ring: bu laboratoriyada bitta topilma keyingisini ochadi.', steps:[ 'Serverdan olib tashlashni unutgan zaxira nusxa faylini toping.', 'Zaxira nusxadan topganingiz bilan portalga kiring.', 'Akkauntingiz qaysi hisobotga bog‘langanini bilib oling.', 'Sizga ko‘rish mumkin bo‘lmagan hisobotni so‘rang.' ], success:'Bitta unutilgan zaxira fayl ishlaydigan parolni berdi, parol — sessiyani, egalikni tekshirmaslik esa — begona maxfiy hisobotni. Haqiqiy zanjirlar shunday ko‘rinadi: har bir “mayda narsa” keyingi eshikni ochadi (A02 → A07 → A01).', hints:['Ma’lumotlar bazasi dumplari ko‘pincha bo‘lim ildizida qoldiriladi — fayl nomi odatda .sql bilan tugaydi.', 'Dumpda login va parol ochiq matnda edi. Portalga kirish asosiy do‘kondagidek ishlaydi, faqat yo‘l /partner bilan boshlanadi.', 'Kirgandan keyin javobda sessiya identifikatori bo‘ladi — uni so‘rovlarda session parametri bilan yuboriladi. Joriy foydalanuvchi profilini odatda /api/me endpointi beradi.', 'Hisobotlar raqamli ID bo‘yicha ochiladi — o‘zingiznikini endi bilasiz. Tartib bo‘yicha keyingisini oling va o‘sha sessiyani yuboring.'] },
b02:{ title:'Saqlanuvchi XSS → sessiyani o‘g‘irlash', scenario:'DemoShop mahsulot kartochkasida xaridorlar sharhlari bor va moderator-bot har bir yangisini ochadi. Sharh ekranlanmasa nima bo‘lishini va sahifani administrator ochsa nimaga olib kelishini tekshiring.', steps:[ '205-mahsulotga sharh qoldiring, matn o‘rniga script-teg joylang.', 'Sharhlar sahifasini oching va uni moderator ochganda nima bo‘lganini ko‘ring.', 'Skript ma’lumot yuborgan tomonga nima tushganini tekshiring.', 'Ushlab olingan narsa bilan admin panelga kiring.' ], success:'Bitta ekranlanmagan sharh administrator sessiyasini o‘g‘irlashga aylandi: XSS da payload qoldirgan emas, sahifani ochgan odam zarar ko‘radi. Keyin begona sessiyani qo‘yish kifoya — va siz “admin”siz.', hints:['Sharh /api/reviews ga product va text parametrlari bilan yuboriladi. text ga istalgan script-teg mos keladi — server uni o‘zgartirmasdan saqlaydi.', 'Sharhlar sahifasi /reviews da, o‘sha product parametri bilan — moderator-bot ham shu yerga kiradi.', 'Bunday hujumning “qabul qilgichi” bo‘ladi — /admin/xss-log kabi yo‘l, unga skript hujumchi serveriga yuborgan hamma narsa tushadi.', 'Ushlab olingan narsa parol emas, tayyor admin sessiyasi; u panel sahifasida (/admin/dashboard) session parametri bilan yuboriladi.'] }

a01:{ scenario:'You\'re logged into DemoShop as a regular shopper, testuser. Your goal is to exploit the missing ownership check and read the invoice belonging to a.karimova.', steps:[ 'Find your session ID and your own order number.', 'Request someone else\'s order by changing the number — the server doesn\'t check ownership.', 'Read the invoice pointed to by the previous response.' ], success:'You reached someone else\'s invoice just by guessing an ID — this is exactly how IDOR is found in practice.', hints:['DemoShop has an endpoint that shows the current user\u2019s session — paths like that are usually called /api/session.', 'An order in the API is reachable at /api/orders/<number> (recall the code example in the A01 theory) — you already know your own number from step 1, try a neighboring one.', 'The previous response pointed to an invoice_id — there\u2019s a similarly structured /api/invoice/<id> path.'] },

a03:{ scenario:'DemoShop\'s dependency scanner flagged something suspicious in the build history. Figure out what got in — and whether it\'s still active.', steps:[ 'Scan the project\'s dependencies.', 'Look at the suspicious commit the scanner reported.', 'Check whether that code is still in the current pipeline config.' ], success:'One overlooked commit in the build chain — and every deployment downloads and runs code from someone else\'s server, and it\'s not a one-off, it\'s part of the live pipeline.', hints:['The trivy tool can scan a project\u2019s filesystem: usually `trivy fs <directory>` — try the app\u2019s current directory (app).', 'The previous step\u2019s output includes a short commit hash — inspect it with `git show <hash>`.', 'The pipeline config file can be read directly — try cat with its name (pipeline.yml).'] },
a04:{ scenario:'Check how well DemoShop is cryptographically protected, and find a forgotten debug endpoint.', steps:[ 'Identify the service versions running on the server.', 'Check the site\'s TLS configuration.', 'Request the path the previous output pointed to.' ], success:'The debug endpoint revealed a single hardcoded secret key — with it, any token can be forged.', hints:['There\u2019s a tool for detecting service versions on open ports — nmap with -sV -sC.', 'There\u2019s a dedicated tool for checking TLS configuration — testssl.sh, it only needs the hostname.', 'The previous step\u2019s output mentioned a specific unusual path — request it directly with curl.'] },
a05:{ scenario:'DemoShop\'s product page has an id parameter. Run the full sqlmap workflow: confirm the injection → list databases → list tables → dump the data.', steps:[ 'Test the id parameter manually with a single quote.', 'Confirm the injection automatically and list the databases.', 'List the tables in the demoshop database.', 'Dump the contents of the secrets table.' ], success:'You just went through a pentester\'s typical SQL injection workflow — from the first symptom to data extraction.', hints:['Append a single quote (\') to the id parameter\u2019s value in the product URL and see how the server responds.', 'sqlmap has a flag that immediately lists databases — --dbs. Don\u2019t forget -u with the URL and --batch so it doesn\u2019t prompt you interactively.', 'The -D flag points at a specific database, and --tables asks for the list of tables inside it.', 'The -T flag points at a specific table, and --dump extracts its contents.'] },
a06:{ scenario:'DemoShop\'s checkout accepts both price and quantity straight from the request. Check what can be forged.', steps:[ 'Look at the cart and the item\'s real price.', 'Place an order, substituting a different price in the request.', 'Try placing an order with a negative quantity.' ], success:'The server should have taken the price from its own catalog and validated the quantity — instead it trusted whatever numbers the client sent, and a negative qty turned an order into a refund.', hints:['A plain GET request to the cart endpoint will show what\u2019s in it right now and at what price.', 'The checkout endpoint accepts parameters directly in the request — try submitting your own price, well below the real one.', 'The same endpoint also accepts qty — try a negative value instead of a positive one.'] },
a07:{ scenario:'Check whether DemoShop\'s admin account is still using a default password — and see what that login gets you.', steps:[ 'Check the password reset form for admin@demoshop.local.', 'Try a common default password.', 'Now that you\'re logged in as admin, check the user list.' ], success:'The reset form confirmed the account exists, the password was never changed since setup — and one default login exposed every user\'s password in the store.', hints:['The password reset form usually lives at a path like /forgot-password, with the email passed right in the request parameters.', 'The login endpoint accepts user and pass as request parameters — try one of the most common weak passwords.', 'The admin user list usually expects a session (or similar) parameter — try passing the role you\'re now "logged in" as.'] },
a08:{ scenario:'DemoShop\'s cart is restored from a state parameter. Check how the server handles that data — and what you can actually make it run.', steps:[ 'Look at this endpoint\'s documentation.', 'Send a specially crafted payload instead of a normal cart state.', 'Check whether this can run a real command on the server.' ], success:'The server deserialized untrusted data directly — all the way to running an arbitrary command on the server (RCE).', hints:['A restore-state feature usually has a debug or docs path next to the main one — something like .../debug.', 'The parameter is called state and is passed directly in the URL — try submitting any nonstandard string instead of a real base64 cart state.', 'Try submitting something that looks like a real OS command in state, such as id.'] },
a09:{ scenario:'Someone left a log file publicly accessible. Find it — and check whether what leaked in it still works.', steps:[ 'Scan the site for hidden paths.', 'Open the log file you found.', 'Try logging in with the password that leaked in the log.' ], success:'The logs turned out to be open to anyone and stored passwords in plaintext — and one of them still worked, turning a log leak into an account takeover.', hints:['ffuf is built for brute-forcing hidden paths — point it at the shop root with a FUZZ marker and the common.txt wordlist.', 'One of the discovered paths looked like a logs folder — files named something like debug.log are often left inside.', 'The log had a login_success line with a password — try logging in with exactly that one.'] },
a10:{ scenario:'DemoShop\'s token verification endpoint crashes on unusual input. Check what happens across a few different kinds of failure.', steps:[ 'Send a request with no token value at all.', 'Check the normal, expected call.', 'Send a deliberately "broken" token.' ], success:'The token-parsing error went unhandled — and the code let the user through by default, even though the empty and the simply-wrong token were both handled correctly.', hints:['The token parameter can be left empty — see how the server reacts to it being missing.', 'The token-verification endpoint takes a token parameter — try any ordinary value to see a normal denial.', 'Try putting a null byte (%00) in the token value before the rest of the text — that\u2019s a classic way simple parsers break.'] },
b01:{ title:'Backup → login → someone else’s report', scenario:'DemoShop recently launched a closed partner portal at /partner — it was thrown together in a hurry. Check whether anything extra was left behind and how far it can take you: in this lab, each finding unlocks the next.', steps:[ 'Find the backup file nobody removed from the server.', 'Log into the portal with what you found in the backup.', 'Find out which report your account is tied to.', 'Request a report you are not supposed to see.' ], success:'One forgotten backup file gave a working password, the password gave a session, and a missing ownership check gave someone else’s confidential report. Real chains look exactly like this: every “small thing” opens the next door (A02 → A07 → A01).', hints:['Database dumps are often left at the root of a section — the filename usually gives it away and ends in .sql.', 'The dump contained a username and password in plaintext. Login works like in the main shop, except the path starts with /partner.', 'After logging in, the response contains a session identifier — pass it in requests as the session parameter. The current user’s profile is usually served by an /api/me endpoint.', 'Reports open by numeric ID — you now know yours. Take the next one in sequence and pass the same session.'] },
b02:{ title:'Stored XSS → session theft', scenario:'DemoShop product pages have customer reviews, and a moderator bot opens every new one. Check what happens if a review isn’t escaped — and what that turns into when an administrator opens the page.', steps:[ 'Leave a review on product 205 with a script tag instead of normal text.', 'Open the reviews page and see what happened when the moderator opened it.', 'Check what landed on the side the script was sending data to.', 'Log into the admin panel with what you intercepted.' ], success:'A single unescaped review turned into stealing an administrator’s session: with XSS, the victim isn’t whoever left the payload but whoever opened the page. After that, just present the stolen session — and you’re “admin”.', hints:['Reviews are submitted to /api/reviews with product and text parameters. Any script tag works in text — the server stores it as is.', 'The reviews page lives at /reviews with the same product parameter — that’s where the moderator bot goes too.', 'Attacks like this have a “receiver” — a path like /admin/xss-log where everything the script sent to the attacker’s server ends up.', 'What leaked isn’t a password but a ready-made admin session; it’s passed as the session parameter on the panel page (/admin/dashboard).'] }

/* ===================== accounts + state ===================== */
const ACCOUNTS_KEY = 'websec_start_accounts_v1';
const PREFS_KEY = 'websec_start_prefs_v1';
const SESSION_KEY = 'websec_start_session_v1';

function hashPass(s){
  // Not cryptographic — this is a local, offline demo profile system, not a
  // security boundary. Good enough to tell "wrong password" from "right one".
  let h = 5381;
  for(let i=0;i<s.length;i++){ h = ((h*33) ^ s.charCodeAt(i)) >>> 0; }
  return h.toString(16);
}
function loadAccounts(){ try{ const raw = localStorage.getItem(ACCOUNTS_KEY); if(raw) return JSON.parse(raw); }catch(e){} return {}; }
function saveAccounts(){ try{ localStorage.setItem(ACCOUNTS_KEY, JSON.stringify(ACCOUNTS)); }catch(e){} }
function loadPrefs(){ try{ const raw = localStorage.getItem(PREFS_KEY); if(raw) return JSON.parse(raw); }catch(e){} return { lang:'ru', theme:'auto' }; }
function savePrefs(){ try{ localStorage.setItem(PREFS_KEY, JSON.stringify(PREFS)); }catch(e){} }
function loadSession(){ try{ return localStorage.getItem(SESSION_KEY) || null; }catch(e){ return null; } }
function saveSession(key){ try{ if(key) localStorage.setItem(SESSION_KEY, key); else localStorage.removeItem(SESSION_KEY); }catch(e){} }

let ACCOUNTS = loadAccounts();
let PREFS = loadPrefs();
if(!PREFS.lang) PREFS.lang = 'ru';
if(!PREFS.theme) PREFS.theme = 'auto';
let SESSION = loadSession();
let S = (SESSION && ACCOUNTS[SESSION]) ? ACCOUNTS[SESSION] : null;
if(S){ if(!S.lessons) S.lessons = {}; if(!S.missions) S.missions = {}; }

const USER_RE = /^[A-Za-z0-9_.-]{3,20}$/;
const TOKEN_KEY = 'websec_start_token_v1';
const STORAGE_OK = (function(){ try{ const k='__wss_probe'; localStorage.setItem(k,'1'); localStorage.removeItem(k); return true; }catch(e){ return false; } })();
let REMOTE = false;   // true when /api answers (deployed on Netlify)
let TOKEN = null;
let SYNC = 'ok';      // ok | pending | error
let saveTimer = null;
function loadToken(){ try{ return localStorage.getItem(TOKEN_KEY) || null; }catch(e){ return null; } }
function saveToken(t){ TOKEN = t; try{ if(t) localStorage.setItem(TOKEN_KEY, t); else localStorage.removeItem(TOKEN_KEY); }catch(e){} }
async function apiFetch(path, opts, tokenOverride){
  opts = opts || {};
  const headers = { 'content-type':'application/json' };
  const tok = tokenOverride || TOKEN;
  if(tok) headers.authorization = 'Bearer ' + tok;
  const res = await fetch('/api/' + path, Object.assign({}, opts, { headers }));
  let data = null; try{ data = await res.json(); }catch(e){}
  return { status:res.status, data };
}
async function detectBackend(){
  if(typeof fetch !== 'function' || location.protocol === 'file:') return false;
  try{
    const r = await Promise.race([ apiFetch('ping'), new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), 3000)) ]);
    return r.status === 200 && !!r.data && r.data.ok === true;
  }catch(e){ return false; }
}
async function remoteAuth(mode, username, password){
  const u = (username||'').trim();
  if(mode === 'register'){
    if(!USER_RE.test(u)) return { ok:false, error:'bad_user' };
    if((password||'').length < 6) return { ok:false, error:'short_pass' };
  }
  let r;
  try{ r = await apiFetch(mode === 'register' ? 'register' : 'login', { method:'POST', body:JSON.stringify({ username:u, password }) }); }
  catch(e){ return { ok:false, error:'network' }; }
  if(r.status === 200 || r.status === 201){
    saveToken(r.data.token);
    S = { username:r.data.username, lessons:r.data.lessons || {}, missions:r.data.missions || {} };
    SYNC = 'ok';
    return { ok:true };
  }
  return { ok:false, error:(r.data && r.data.error) || 'network' };
}
function paintSync(){
  const d = document.getElementById('syncDot');
  if(d){ d.className = 'sync ' + SYNC; d.title = T().ui['sync_' + SYNC] || ''; }
}
async function pushProgress(keepalive){
  clearTimeout(saveTimer);
  if(!REMOTE || !TOKEN || !S) return;
  try{
    const r = await apiFetch('progress', { method:'PUT', keepalive:!!keepalive, body:JSON.stringify({ lessons:S.lessons, missions:S.missions }) });
    if(r.status === 401){ saveToken(null); S = null; SYNC = 'ok'; route(); return; }
    SYNC = r.status === 200 ? 'ok' : 'error';
  }catch(e){ SYNC = 'error'; }
  paintSync();
}
async function deleteAccount(){
  if(REMOTE){ try{ await apiFetch('me', { method:'DELETE' }); }catch(e){} saveToken(null); S = null; }
  else { if(SESSION){ delete ACCOUNTS[SESSION]; saveAccounts(); } SESSION = null; saveSession(null); S = null; }
  location.hash = '#/';
  route();
}

function currentUser(){ return S ? S.username : null; }
function registerAccount(username, password){
  const u = (username||'').trim();
  const key = u.toLowerCase();
  if(!USER_RE.test(u)) return { ok:false, error:'bad_user' };
  if((password||'').length < 6) return { ok:false, error:'short_pass' };
  if(ACCOUNTS[key]) return { ok:false, error:'taken' };
  ACCOUNTS[key] = { username:u, passHash:hashPass(password), lessons:{}, missions:{}, createdAt:Date.now() };
  saveAccounts();
  SESSION = key; saveSession(key);
  S = ACCOUNTS[key];
  return { ok:true };
}
function loginAccount(username, password){
  const key = (username||'').trim().toLowerCase();
  const acc = ACCOUNTS[key];
  if(!acc || acc.passHash !== hashPass(password||'')) return { ok:false, error:'bad_creds' };
  SESSION = key; saveSession(key);
  S = acc; if(!S.lessons) S.lessons = {}; if(!S.missions) S.missions = {};
  return { ok:true };
}
function logout(){
  if(REMOTE){
    const tok = TOKEN, body = S ? JSON.stringify({ lessons:S.lessons, missions:S.missions }) : null;
    clearTimeout(saveTimer);
    if(tok){
      // send the last progress, then end the session (in that order), without making the user wait
      (async()=>{ try{ if(body) await apiFetch('progress', { method:'PUT', body }, tok); await apiFetch('logout', { method:'POST' }, tok); }catch(e){} })();
    }
    saveToken(null); S = null; SYNC = 'ok';
    route();
    return;
  }
  SESSION = null; saveSession(null); S = null;
  route();
}
function saveState(){
  if(!S) return;
  if(REMOTE){
    SYNC = 'pending'; paintSync();
    clearTimeout(saveTimer);
    saveTimer = setTimeout(()=>pushProgress(), 700);
    return;
  }
  if(SESSION) saveAccounts();
}

function cmdOutput(raw){
  const cmd = raw.trim();
  const low = cmd.toLowerCase();
  if(cmd==='') return '';
  if(low==='help') return [
    ['tl-blue','Доступные команды / Available commands:'],
    ['tl-dim','  nmap, whatweb, ffuf, nikto, curl, sqlmap, testssl.sh, trivy'],
    ['tl-dim','  ls, cat <файл>, nano <файл>, echo, pwd, whoami, date, clear'],
    ['tl-dim','Пример / example: curl -I http://'+HOST]
  ].map(([c,x])=>termLine(c,x)).join('');
  if(low==='clear') return '__CLEAR__';
  if(low==='whoami') return termLine('', 'student');
  if(low==='pwd') return termLine('', '/home/student');
  if(low==='ls') return termLine('', 'labs  notes.txt  wordlists');
  if(low==='ls wordlists' || low==='ls ./wordlists' || low==='ls wordlists/') return termLine('', 'common.txt');
  if(low==='ls labs' || low==='ls ./labs' || low==='ls labs/') return termLine('', VULNS.map(v=>v.id).join('  '));
  if(low==='date') return termLine('', new Date().toString());
  const catMatch = cmd.match(/^cat\s+(\S+)$/i);
  if(catMatch){
    const path = catMatch[1].replace(/^\.\//,'').replace(/^~\//,'');
    if(FILES[path]) return FILES[path].map(([c,x])=>termLine(c,x)).join('');
    return termLine('tl-red', `cat: ${catMatch[1]}: No such file or directory`);
  }
  const nanoMatch = cmd.match(/^nano\s+(\S+)$/i);
  if(nanoMatch){
    const path = nanoMatch[1].replace(/^\.\//,'').replace(/^~\//,'');
    const header = termLine('tl-dim', `GNU nano 6.2                                    ${path}`);
    const footer = termLine('tl-dim', '^X Выход   (в этом эмуляторе nano только для чтения)');
    if(FILES[path]) return header + FILES[path].map(([c,x])=>termLine(c,x)).join('') + footer;
    return header + termLine('tl-dim', '(новый пустой файл)') + footer;
  }
  const echoMatch = cmd.match(/^echo\s+(.*)$/i);
  if(echoMatch){
    let text = echoMatch[1].trim();
    const pipeB64d = text.match(/^(.*)\|\s*base64\s+(-d|--decode)$/i);
    const pipeB64e = text.match(/^(.*)\|\s*base64\s*$/i);
    const stripQuotes = s => s.trim().replace(/^["']|["']$/g,'');
    if(pipeB64d){
      const payload = stripQuotes(pipeB64d[1]);
      try{ return termLine('', atob(payload)); }
      catch(e){ return termLine('tl-red', 'base64: invalid input'); }
    }

/* `login user pass` is sugar for the real login request every lab already checks —
   it goes through the exact same URL comparison, so it never bypasses anything. */
function rewriteShorthand(raw, labId){
  const s = raw.trim();
  const login = s.match(/^login\s+(\S+)\s+(\S+)\s*$/i);
  if(login) return `curl "http://${HOST}/${labId==='b01'?'partner':'shop'}/login?user=${login[1]}&pass=${login[2]}"`;
  const toolMatch = s.match(/^(\S+)/);
  const tool = toolMatch ? toolMatch[1].toLowerCase() : '';
  if(tool==='wget' || tool==='http' || tool==='https' || tool==='httpie'){
    const urlMatch = s.match(/https?:\/\/[^\s"'`]+/i);
    if(urlMatch) return `curl "${urlMatch[0]}"`;
  }
  return raw;
}
function extractUrl(s){
  const m = s.match(/https?:\/\/[^\s"'`]+/i);
  return m ? m[0] : null;
}
function normalizeUrl(url){
  try{
    const u = new URL(url);
    const params = [...u.searchParams.entries()].sort((a,b)=> a[0]<b[0]?-1:(a[0]>b[0]?1:0));
    const qs = params.map(([k,v])=>`${k}=${v}`).join('&');
    return (u.host + u.pathname.replace(/\/+$/,'')).toLowerCase() + (qs?'?'+qs.toLowerCase():'');
  }catch(e){
    return url.toLowerCase();
  }
}
function cmdKey(s){
  return s.toLowerCase().replace(/[\u2018\u2019\u201c\u201d'"]/g,'').trim().split(/\s+/).filter(Boolean).sort().join(' ');
}
function labStepLookup(raw, labId){
  const ld = LAB_DEFS[labId]; if(!ld) return null;
  const tool = (raw.trim().match(/^(\S+)/)||[,''])[1].toLowerCase();
  const isWebTool = tool==='curl';
  const userUrl = isWebTool ? extractUrl(raw) : null;
  for(let i=0;i<ld.steps.length;i++){
    const stepCmd = ld.steps[i].cmd;
    if(ld.steps[i].re){
      if(new RegExp(ld.steps[i].re,'i').test(raw)) return { i, out: ld.steps[i].out };
      continue;
    }
    if(/^curl\b/i.test(stepCmd.trim())){
      if(!userUrl) continue;
      const stepUrl = extractUrl(stepCmd);
      if(stepUrl && normalizeUrl(userUrl) === normalizeUrl(stepUrl)) return { i, out: ld.steps[i].out };
    } else if(cmdKey(stepCmd) === cmdKey(raw)){
      return { i, out: ld.steps[i].out };
    }
  }
  return null;
}

const termHistories = {};
function mountTerminalWidget(container, instanceId, opts){
  opts = opts || {};
  const wrap = container.querySelector(`[data-term-id="${instanceId}"]`);
  if(!wrap) return;
  const input = wrap.querySelector('.term-in input');
  if(!termHistories[instanceId]) termHistories[instanceId] = { list:[], idx:-1 };
  const hist = termHistories[instanceId];
  const form = wrap.querySelector('form.term-in');
  const runNow = () => {
    const v = input.value;
    if(v.trim()!==''){ hist.list.push(v); hist.idx = hist.list.length; }
    termRunCommand(wrap, v, opts.labId);
    input.value = '';
  };
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter'){
      e.preventDefault();
      runNow();
    } else if(e.key==='ArrowUp'){
      if(hist.idx>0){ hist.idx--; input.value = hist.list[hist.idx]||''; }
      e.preventDefault();
    } else if(e.key==='ArrowDown'){
      if(hist.idx<hist.list.length-1){ hist.idx++; input.value = hist.list[hist.idx]||''; }
      else { hist.idx = hist.list.length; input.value=''; }
      e.preventDefault();
    }
  });
  if(form) form.addEventListener('submit', e=>{
    // mobile keyboards ("Go") and the run button come through here; Enter on desktop is handled above
    e.preventDefault();
    runNow();
    try{ input.focus({preventScroll:true}); }catch(err){}
  });
  wrap.querySelectorAll('.quick button').forEach(b=>{
    b.addEventListener('click', ()=>{ input.value = b.getAttribute('data-c'); input.focus({preventScroll:true}); });
  });
  if(opts.initialCmd){ termRunCommand(wrap, opts.initialCmd, opts.labId); }
  // don't pop the on-screen keyboard open on phones/tablets just because a page loaded
  const finePointer = typeof matchMedia === 'function' && matchMedia('(hover:hover) and (pointer:fine)').matches;
  if(finePointer) input.focus({preventScroll:true});
}

  const doneSteps = VULNS.reduce((a,v)=>{
    const st = S.lessons[v.id];
    if(!st || !st.labSteps) return a;
    return a + Object.keys(st.labSteps).filter(k=>st.labSteps[k]).length;
  }, 0);
  const missionsDone = Object.keys(S.missions).filter(k=>S.missions[k]).length;
  const bonusDone = BONUS.filter(b=>S.lessons[b.id] && S.lessons[b.id].status==='passed').length;
  return `<section class="page">
    <h1>${esc(t.progressTitle)}</h1>
    <div class="meters">
      <div class="meter"><div class="row-top"><span class="l">${esc(t.progressLessons)}</span><span class="n">${passed}/${total}</span></div>
        <div class="bar"><i style="width:${Math.round(passed/total*100)}%"></i></div></div>
      <div class="meter"><div class="row-top"><span class="l">${esc(t.progressSteps)}</span><span class="n">${doneSteps}/${totalSteps}</span></div>
        <div class="bar"><i style="width:${Math.round(doneSteps/totalSteps*100)}%"></i></div></div>
      <div class="meter"><div class="row-top"><span class="l">${esc(t.progressMissions)}</span><span class="n">${missionsDone}/${MISSIONS.length}</span></div>
        <div class="bar"><i style="width:${Math.round(missionsDone/MISSIONS.length*100)}%"></i></div></div>
      <div class="meter"><div class="row-top"><span class="l">${esc(t.progressBonus)}</span><span class="n">${bonusDone}/${BONUS.length}</span></div>
        <div class="bar"><i style="width:${Math.round(bonusDone/BONUS.length*100)}%"></i></div></div>
    </div>
    ${registryBlock()}
    <div class="actions"><button class="btn alt" id="resetBtn">${esc(t.resetProgress)}</button><button class="btn alt" id="deleteBtn">${esc(t.deleteAccount)}</button></div>
  </section>`;
}

/* ===================== router ===================== */
function route(){
  const hash = location.hash || '#/';
  const [path, qs] = hash.slice(1).split('?');
  const parts = path.split('/').filter(Boolean);
  const app = document.getElementById('app');
  applyTheme();
  renderHeader();

  if(!S){
    document.getElementById('nav').innerHTML = '';
    const mode = parts[0]==='register' ? 'register' : 'login';
    app.innerHTML = pageAuth(mode);
    mountAuth(mode);
    window.scrollTo(0,0);
    return;
  }
  if(parts[0]==='login' || parts[0]==='register'){ location.hash = '#/'; return; }
  renderNav();

  if(parts.length===0){ app.innerHTML = pageHome(); }
  else if(parts[0]==='theory'){ app.innerHTML = pageTheory(); }
  else if(parts[0]==='lesson' && parts[1]){
    const tab = parts[2] || 'theory';
    app.innerHTML = pageLesson(parts[1], tab);
    if(tab==='practice') mountLabPractice(parts[1]);
    renderNav();
  }
  else if(parts[0]==='bonus' && parts[1] && BONUS.some(b=>b.id===parts[1])){
    app.innerHTML = pageBonus(parts[1]);
    mountLabPractice(parts[1]);
    renderNav();
  }
  else if(parts[0]==='scoreboard' && REMOTE){ app.innerHTML = pageScoreboardShell(); mountScoreboard(); }
  else if(parts[0]==='tools' && parts[1]){ app.innerHTML = pageToolDetail(parts[1]); }
  else if(parts[0]==='tools'){ app.innerHTML = pageTools(); }
  else if(parts[0]==='terminal'){
    let initCmd = null;
    if(qs){ const p = new URLSearchParams(qs); if(p.get('cmd')) initCmd = p.get('cmd'); }
    app.innerHTML = pageTerminal();
    mountTerminal(initCmd);
  }
  else if(parts[0]==='progress'){
    app.innerHTML = pageProgress();
    const db = document.getElementById('deleteBtn');
    if(db) db.addEventListener('click', ()=>{ if(confirm(T().ui.deleteConfirm)) deleteAccount(); });
    const rb = document.getElementById('resetBtn');
    if(rb) rb.addEventListener('click', ()=>{
      if(confirm(T().ui.resetConfirm)){ S.lessons={}; S.missions={}; saveState(); route(); }
    });
  }
  else { app.innerHTML = pageHome(); }
  window.scrollTo(0,0);
}
function renderAll(){ route(); }

window.addEventListener('hashchange', route);
window.addEventListener('DOMContentLoaded', async ()=>{
  applyTheme();
  document.getElementById('app').innerHTML = '<p class="cmdline"><span class="ps2">$</span> connecting…</p>';
  REMOTE = await detectBackend();
  if(REMOTE){
    S = null;               // accounts live on the server, ignore any local ones
    TOKEN = loadToken();
    if(TOKEN){
      try{
        const r = await apiFetch('me');
        if(r.status === 200) S = { username:r.data.username, lessons:r.data.lessons || {}, missions:r.data.missions || {} };
        else if(r.status === 401) saveToken(null);
      }catch(e){}
    }
  }
  route();
});
window.addEventListener('online', ()=>{ if(REMOTE && SYNC === 'error') pushProgress(); });
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState === 'hidden' && REMOTE && SYNC === 'pending') pushProgress(true); });
window.addEventListener('pagehide', ()=>{ if(REMOTE && SYNC === 'pending') pushProgress(true); });
</script>
</body>
